// Camada viva sobre a cena: luz que desloca, água que cintila, partículas.
// Um único loop de animação serve o slide visível; os demais ficam parados.
(function () {
  "use strict";

  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rnd(seed) {
    let s = seed >>> 0;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  }

  // que partículas cada céu pede
  function kindOf(sky) {
    if (sky === "night") return "stars";
    if (sky === "alpine") return "snow";
    if (sky === "interior" || sky === "underground") return "dust";
    if (sky === "dawn" || sky === "gold" || sky === "dusk") return "embers";
    return "haze";
  }

  const TONE = {
    stars:  "rgba(214,228,255,",
    snow:   "rgba(255,255,255,",
    dust:   "rgba(210,178,120,",
    embers: "rgba(255,208,150,",
    haze:   "rgba(255,250,240,"
  };

  function Field(canvas, scene) {
    this.c = canvas;
    this.ctx = canvas.getContext("2d");
    this.scene = scene;
    this.art = scene.art || {};
    this.kind = kindOf(this.art.sky);
    this.r = rnd(scene.name.length * 7919 + (this.art.kind || "").length * 104729);
    this.parts = [];
    this.t = 0;
    this.size();
  }

  Field.prototype.size = function () {
    const box = this.c.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = Math.max(2, Math.round(box.width));
    this.H = Math.max(2, Math.round(box.height));
    this.c.width = this.W * this.dpr;
    this.c.height = this.H * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.horizon = (this.art.sky === "interior" || this.art.sky === "underground")
      ? this.H * 0.9 : this.H * (this.art.water ? 0.62 : 0.74);
    this.seed();
  };

  Field.prototype.seed = function () {
    const n = this.kind === "haze" ? 26 : this.kind === "stars" ? 70 : 46;
    this.parts = [];
    for (let i = 0; i < n; i++) {
      const top = this.kind === "stars" ? this.horizon * 0.86 : this.H;
      this.parts.push({
        x: this.r() * this.W,
        y: this.r() * top,
        z: 0.3 + this.r() * 0.7,
        p: this.r() * 6.28,
        s: 0.4 + this.r() * 1.5
      });
    }
    // faixas de brilho na água
    this.glints = [];
    if (this.art.water) {
      for (let i = 0; i < 30; i++) {
        this.glints.push({
          y: this.r(),
          x: this.r(),
          w: 0.04 + this.r() * 0.24,
          p: this.r() * 6.28,
          sp: 0.25 + this.r() * 0.7
        });
      }
    }
  };

  Field.prototype.frame = function (dt) {
    const ctx = this.ctx, W = this.W, H = this.H;
    this.t += dt;
    const t = this.t;
    ctx.clearRect(0, 0, W, H);

    // bruma de luz que passeia devagar
    const gx = W * (0.5 + Math.sin(t * 0.045) * 0.34);
    const gy = this.horizon - H * (0.16 + Math.cos(t * 0.031) * 0.07);
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, H * 0.62);
    const warm = this.art.sky === "night" ? "rgba(150,185,255," : "rgba(255,226,178,";
    g.addColorStop(0, warm + (0.2 + Math.sin(t * 0.12) * 0.05) + ")");
    g.addColorStop(0.5, warm + "0.05)");
    g.addColorStop(1, warm + "0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, this.horizon + 4);

    // água: cintilância horizontal
    if (this.art.water) {
      const top = this.horizon, span = H - top;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, top, W, span); ctx.clip();
      for (let i = 0; i < this.glints.length; i++) {
        const q = this.glints[i];
        const y = top + span * Math.pow(q.y, 1.4);
        const wob = Math.sin(t * q.sp + q.p);
        const x = (q.x * W + wob * W * 0.04 + W) % W;
        const w = W * q.w * (0.7 + 0.3 * Math.abs(wob));
        const a = 0.05 + 0.14 * (0.5 + 0.5 * Math.sin(t * q.sp * 1.7 + q.p));
        ctx.fillStyle = "rgba(255,244,224," + (a * (0.35 + q.y)) + ")";
        ctx.fillRect(x - w / 2, y, w, Math.max(1, H * 0.0035));
      }
      ctx.restore();
    }

    // partículas
    const tone = TONE[this.kind];
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      let x = p.x, y = p.y, a = 0;

      if (this.kind === "stars") {
        a = 0.25 + 0.6 * Math.abs(Math.sin(t * (0.4 + p.z) + p.p));
        a *= 1 - y / (this.horizon * 0.9);
      } else if (this.kind === "snow") {
        p.y += dt * 16 * p.z;
        p.x += Math.sin(t * 0.6 + p.p) * dt * 12 * p.z;
        if (p.y > H) { p.y = -8; p.x = this.r() * W; }
        x = p.x; y = p.y; a = 0.28 * p.z;
      } else if (this.kind === "dust") {
        p.y -= dt * 4 * p.z;
        p.x += Math.sin(t * 0.25 + p.p) * dt * 7;
        if (p.y < -8) { p.y = H + 8; p.x = this.r() * W; }
        x = p.x; y = p.y;
        a = (0.1 + 0.16 * Math.abs(Math.sin(t * 0.5 + p.p))) * p.z;
      } else if (this.kind === "embers") {
        p.y -= dt * 7 * p.z;
        p.x += Math.sin(t * 0.4 + p.p) * dt * 9;
        if (p.y < -8) { p.y = H + 8; p.x = this.r() * W; }
        x = p.x; y = p.y;
        a = (0.08 + 0.2 * Math.abs(Math.sin(t * 0.7 + p.p))) * p.z;
      } else {
        p.x += dt * 5 * p.z;
        if (p.x > W + 20) { p.x = -20; p.y = this.r() * this.horizon; }
        x = p.x; y = p.y + Math.sin(t * 0.3 + p.p) * 4;
        a = 0.05 * p.z;
      }

      if (a <= 0.004) continue;
      const s = p.s * (this.kind === "haze" ? 9 : 1.5) * p.z;
      ctx.fillStyle = tone + a.toFixed(3) + ")";
      if (this.kind === "haze") {
        ctx.beginPath(); ctx.ellipse(x, y, s * 3, s, 0, 0, 6.3); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x, y, s, 0, 6.3); ctx.fill();
      }
    }
  };

  // ---- orquestração --------------------------------------------------------

  let fields = new Map(), active = null, raf = null, last = 0;

  function loop(now) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    if (active) active.frame(dt);
  }

  const Motion = {
    attach: function (canvas, scene) {
      const f = new Field(canvas, scene);
      fields.set(canvas, f);
      return f;
    },
    play: function (canvas, scene) {
      if (reduce) { active = null; return; }
      let f = fields.get(canvas);
      if (!f || f.scene !== scene) { f = this.attach(canvas, scene); }
      f.size();
      active = f;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
    },
    pause: function () { if (raf) { cancelAnimationFrame(raf); raf = null; } },
    resume: function () { if (!raf && active) { last = performance.now(); raf = requestAnimationFrame(loop); } },
    resize: function () { fields.forEach((f) => f.size()); }
  };

  window.Motion = Motion;
})();

// Ambiente sonoro sintetizado: arpejo em movimento sobre acorde maior.
// Sem arquivos externos — funciona offline e só começa depois de um gesto do usuário.
(function () {
  "use strict";

  // root: nota base (Hz, registro médio) · chord: intervalos em semitons
  // bpm: andamento · beats: 3 = valsa, 4 = binário · pat: caminho do arpejo
  // wave: timbre · cut: brilho do filtro (Hz) · air: textura de fundo (0–1)
  const MOODS = {
    paris:      { root: 293.66, chord: [0, 4, 7, 11, 16], bpm: 112, beats: 3, pat: "up",     wave: "sawtooth", cut: 2600, air: 0.05 },
    brussels:   { root: 261.63, chord: [0, 4, 7, 9, 16],  bpm: 108, beats: 4, pat: "updown", wave: "triangle", cut: 2400, air: 0.05 },
    amsterdam:  { root: 293.66, chord: [0, 2, 7, 11, 14], bpm: 100, beats: 4, pat: "skip",   wave: "triangle", cut: 3200, air: 0.16 },
    cologne:    { root: 261.63, chord: [0, 4, 7, 12, 16], bpm: 104, beats: 4, pat: "up",     wave: "triangle", cut: 2800, air: 0.05 },
    luxembourg: { root: 277.18, chord: [0, 4, 7, 9, 14],  bpm: 100, beats: 4, pat: "updown", wave: "sine",     cut: 2400, air: 0.07 },
    strasbourg: { root: 311.13, chord: [0, 4, 7, 11, 14], bpm: 106, beats: 3, pat: "up",     wave: "sawtooth", cut: 2600, air: 0.06 },
    lucerne:    { root: 329.63, chord: [0, 7, 12, 16, 19], bpm: 96, beats: 4, pat: "updown", wave: "sine",     cut: 3600, air: 0.20 },
    milan:      { root: 311.13, chord: [0, 4, 7, 9, 16],  bpm: 120, beats: 4, pat: "skip",   wave: "sawtooth", cut: 3100, air: 0.06 },
    venice:     { root: 329.63, chord: [0, 4, 7, 11, 14], bpm: 104, beats: 3, pat: "updown", wave: "triangle", cut: 3000, air: 0.20 },
    vienna:     { root: 293.66, chord: [0, 4, 7, 11, 16], bpm: 168, beats: 3, pat: "up",     wave: "sawtooth", cut: 2800, air: 0.04 },
    budapest:   { root: 329.63, chord: [0, 4, 6, 11, 16], bpm: 124, beats: 4, pat: "skip",   wave: "sawtooth", cut: 3000, air: 0.10 },
    bratislava: { root: 293.66, chord: [0, 4, 7, 14, 16], bpm: 114, beats: 4, pat: "up",     wave: "triangle", cut: 2600, air: 0.07 },
    krakow:     { root: 277.18, chord: [0, 4, 7, 12, 16], bpm: 106, beats: 4, pat: "updown", wave: "triangle", cut: 2500, air: 0.06 },
    prague:     { root: 311.13, chord: [0, 4, 6, 11, 14], bpm: 112, beats: 4, pat: "skip",   wave: "sawtooth", cut: 2900, air: 0.08 }
  };

  const PATTERNS = {
    up:     [0, 1, 2, 3, 4, 3, 2, 1],
    updown: [0, 2, 4, 2, 1, 3, 4, 3],
    skip:   [0, 2, 1, 4, 2, 3, 0, 4]
  };

  let ctx = null, master = null, verb = null, dry = null;
  let padVoices = [], airGain = null, airFilter = null;
  let tickTimer = null, nextTime = 0, step = 0;
  let mood = MOODS.paris, current = null, enabled = false;

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    // reverb curto: dá espaço sem virar catedral
    verb = ctx.createConvolver();
    verb.buffer = impulse(1.3, 3.4);
    const verbGain = ctx.createGain();
    verbGain.gain.value = 0.26;
    verb.connect(verbGain); verbGain.connect(master);

    dry = ctx.createGain();
    dry.gain.value = 0.9;
    dry.connect(master);

    // textura leve (água, ar) — discreta, só para dar lugar
    const len = ctx.sampleRate * 4;
    const nb = ctx.createBuffer(1, len, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.04 * w) / 1.04;
      nd[i] = last * 2.4;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = nb; noise.loop = true;
    airFilter = ctx.createBiquadFilter();
    airFilter.type = "bandpass"; airFilter.frequency.value = 2600; airFilter.Q.value = 0.6;
    airGain = ctx.createGain(); airGain.gain.value = 0;
    noise.connect(airFilter); airFilter.connect(airGain);
    airGain.connect(dry);
    noise.start();
    return true;
  }

  const hz = (root, semi) => root * Math.pow(2, semi / 12);

  // nota dedilhada: ataque rápido, cauda curta
  function pluck(freq, time, vel) {
    const osc = ctx.createOscillator();
    osc.type = mood.wave;
    osc.frequency.value = freq;

    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(mood.cut * 1.7, time);
    filt.frequency.exponentialRampToValueAtTime(mood.cut * 0.55, time + 0.32);
    filt.Q.value = 1.2;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vel, time + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.55);

    osc.connect(filt); filt.connect(g);
    g.connect(dry); g.connect(verb);
    osc.start(time); osc.stop(time + 0.6);
  }

  // baixo macio marcando o tempo forte
  function bass(freq, time) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.13, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.7);
    osc.connect(g); g.connect(dry);
    osc.start(time); osc.stop(time + 0.75);
  }

  function scheduleStep(n, time) {
    const pat = PATTERNS[mood.pat] || PATTERNS.up;
    const perBar = mood.beats * 2;
    const inBar = n % perBar;

    // arpejo em colcheias
    const deg = pat[n % pat.length];
    const oct = (Math.floor(n / pat.length) % 2) ? 12 : 0;
    const accent = inBar === 0 ? 1 : (inBar % 2 === 0 ? 0.72 : 0.5);
    pluck(hz(mood.root, mood.chord[deg] + oct), time, 0.1 * accent);

    // brilho uma oitava acima nos tempos fortes
    if (inBar === 0 || (mood.beats === 4 && inBar === 4)) {
      pluck(hz(mood.root, mood.chord[deg] + 24), time + 0.006, 0.035);
    }

    // baixo: valsa marca só o 1; binário marca 1 e 3
    if (inBar === 0) bass(hz(mood.root, -24), time);
    else if (mood.beats === 4 && inBar === 4) bass(hz(mood.root, mood.chord[2] - 24), time);
    // valsa: acompanhamento nos tempos 2 e 3
    else if (mood.beats === 3 && (inBar === 2 || inBar === 4)) {
      pluck(hz(mood.root, mood.chord[2]), time, 0.045);
      pluck(hz(mood.root, mood.chord[1]), time + 0.004, 0.04);
    }
  }

  function tick() {
    if (!enabled || !ctx) return;
    const stepDur = 60 / mood.bpm / 2;
    while (nextTime < ctx.currentTime + 0.14) {
      if (nextTime > ctx.currentTime - 0.05) scheduleStep(step, nextTime);
      nextTime += stepDur;
      step++;
    }
  }

  function setPad(t) {
    padVoices.forEach((v) => {
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setTargetAtTime(0, t, 0.5);
      try { v.osc.stop(t + 2.5); } catch (e) {}
    });
    padVoices = [];

    // colchão suave sob o arpejo, em registro médio
    [0, 2, 3].forEach((di, i) => {
      const osc = ctx.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = hz(mood.root, mood.chord[di] - 12);
      osc.detune.value = (i % 2 ? 1 : -1) * 5;

      const filt = ctx.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.value = mood.cut * 0.8;
      filt.Q.value = 0.8;

      const g = ctx.createGain();
      g.gain.value = 0;
      g.gain.setTargetAtTime(0.032 / (i * 0.5 + 1), t, 1.4);

      osc.connect(filt); filt.connect(g);
      g.connect(dry); g.connect(verb);
      osc.start();
      padVoices.push({ osc: osc, gain: g });
    });
  }

  function apply(id) {
    if (!ctx || !enabled) return;
    mood = MOODS[id] || MOODS.paris;
    const t = ctx.currentTime;
    setPad(t);
    airGain.gain.setTargetAtTime(mood.air * 0.22, t, 1.5);
    airFilter.frequency.setTargetAtTime(mood.cut * 1.2, t, 1.5);
    // realinha o compasso na troca de capítulo
    step = 0;
    nextTime = Math.max(nextTime, t + 0.08);
    current = id;
  }

  const Ambience = {
    get enabled() { return enabled; },
    available: function () { return !!(window.AudioContext || window.webkitAudioContext); },
    start: function (id) {
      if (!ctx && !build()) return false;
      if (ctx.state === "suspended") ctx.resume();
      enabled = true;
      master.gain.setTargetAtTime(0.42, ctx.currentTime, 1.1);
      nextTime = ctx.currentTime + 0.1;
      step = 0;
      apply(id || current || "paris");
      if (!tickTimer) tickTimer = setInterval(tick, 25);
      return true;
    },
    stop: function () {
      if (!ctx) return;
      enabled = false;
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    },
    toggle: function (id) {
      if (enabled) { this.stop(); return false; }
      return this.start(id);
    },
    setChapter: function (id) {
      if (id === current) return;
      if (!enabled) { current = id; return; }
      apply(id);
    }
  };

  window.Ambience = Ambience;
})();

/* ===== app.js ===== */
(function () {
  "use strict";

  const T = window.TRIP;
  const deck = document.getElementById("deck");
  const rail = document.getElementById("rail");
  const hint = document.getElementById("hint");
  const SCENE_MS = 7000;

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---- montagem dos slides -------------------------------------------------

  const slides = [];

  function stageFor(scenes, accent) {
    const stage = el("div", "stage");
    const art = el("canvas", "art");
    art.setAttribute("aria-hidden", "true");
    stage.appendChild(art);
    const mo = el("canvas", "motion");
    mo.setAttribute("aria-hidden", "true");
    stage.appendChild(mo);
    scenes.forEach((sc, i) => {
      const img = el("img");
      img.alt = sc.name;
      img.decoding = "async";
      img.dataset.i = i;
      img.addEventListener("error", () => { img.dataset.failed = "1"; sync(); });
      img.addEventListener("load", () => { delete img.dataset.failed; sync(); });
      if (sc.photo) img.src = sc.photo; else img.dataset.failed = "1";
      stage.appendChild(img);
    });
    const tint = el("div", "tint");
    tint.style.background = accent;
    stage.appendChild(tint);
    stage.appendChild(el("div", "scrim"));
    return stage;
  }

  // capa
  const coverScenes = [
    T.chapters[0].scenes[2],  // Torre Eiffel
    T.chapters[8].scenes[0],  // Veneza
    T.chapters[6].scenes[1],  // Titlis
    T.chapters[13].scenes[1]  // Praga
  ];
  {
    const s = el("section", "slide slide-hero");
    s.dataset.kind = "cover";
    s.appendChild(stageFor(coverScenes, "#3F7BA8"));
    s.appendChild(el("div", "hero-wrap", `
      <p class="eyebrow">${esc(T.meta.eyebrow)}</p>
      <h1 class="hero-title">Europa<em>em 15 dias</em></h1>
      <p class="hero-copy">Do primeiro café em Paris à última noite em Viena.
        Doze países ligados por trilhos — e três noites dormindo sobre eles,
        entre ${T.meta.start} e ${T.meta.end} de ${T.meta.month} de ${T.meta.year}.</p>
      <div class="hero-meta">
        <div><strong>${T.meta.start}&#8202;–&#8202;${T.meta.end}</strong><span>${T.meta.month} ${T.meta.year}</span></div>
        <div><strong>${T.meta.countries}</strong><span>países</span></div>
        <div><strong>${T.meta.stops}</strong><span>cidades nossas</span></div>
        <div><strong>${T.meta.nightTrains}</strong><span>noites no trem</span></div>
      </div>
      <button class="start" id="begin"><span class="dot"></span> Iniciar a viagem</button>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "cover", scenes: coverScenes, accent: "#3F7BA8", audio: "paris" });
  }

  // capítulos
  T.chapters.forEach((ch, ci) => {
    const s = el("section", "slide slide-chapter");
    s.dataset.kind = "chapter";
    s.dataset.side = ci % 2 ? "right" : "left";
    s.style.setProperty("--accent", ch.accent);
    s.appendChild(stageFor(ch.scenes, ch.accent));

    const rows = ch.scenes.map((sc, i) => `
      <li>
        <button class="scene-row" data-scene="${i}">
          <span class="scene-time">${esc(sc.time)}</span>
          <span class="scene-name">${esc(sc.name)}</span>
          <span class="scene-note">${esc(sc.note)}</span>
        </button>
      </li>`).join("");

    const leg = ch.leg || {};
    const via = (leg.via && leg.via.length)
      ? `<span class="leg-via"><i>só pela janela</i>${leg.via.map(esc).join(" · ")}</span>`
      : "";
    const legBlock = `
      <div class="leg${leg.night ? " is-night" : ""}">
        <span class="leg-head">
          <span class="leg-mode">${esc(leg.mode || "")}</span>
          <span class="leg-route">${esc(leg.label || "")}</span>
        </span>
        ${leg.time ? `<span class="leg-time">${esc(leg.time)}${leg.dur ? "<i>" + esc(leg.dur) + "</i>" : ""}</span>` : ""}
        ${via}
      </div>`;

    s.appendChild(el("div", "chapter-body", `
      <div class="panel">
        <div class="ch-head">
          <span class="ch-n">${ch.n} / ${String(T.chapters.length).padStart(2, "0")}</span>
          <span class="ch-country">${esc(ch.country)}</span>
          <span class="ch-dates">${esc(ch.dates)}</span>
        </div>
        <h2 class="ch-city">${esc(ch.city)}${ch.sub ? `<em>${esc(ch.sub)}</em>` : ""}</h2>
        ${legBlock}
        <p class="ch-intro">${esc(ch.intro)}</p>
        <ul class="scenes">${rows}</ul>
        <p class="sleep"><b>dormimos em</b><span>${esc(ch.sleep || "")}</span></p>
      </div>
    `));
    s.appendChild(el("div", "scene-hud"));
    deck.appendChild(s);
    slides.push({ node: s, kind: "chapter", scenes: ch.scenes, accent: ch.accent, audio: ch.id, ch: ch });
  });

  // calendário + logística
  {
    const rows = T.calendar.map((d) => `
      <div class="cal-row${d.night ? " is-night" : ""}">
        <div class="cal-day">${d.d}<small>${esc(d.wd)}</small></div>
        <div class="cal-main">
          <span class="cal-place">${esc(d.place)}</span>
          <span class="cal-detail">${esc(d.detail)}</span>
          <span class="cal-route"><i>só pela janela</i>${esc(d.route)}</span>
        </div>
        <div class="cal-sleep"><i>noite</i>${esc(d.sleep)}</div>
      </div>`).join("");
    const logs = T.logistics.map((l) => `
      <div class="log-item"><h3>${esc(l.t)}</h3><p>${esc(l.d)}</p></div>`).join("");
    const flags = T.countries.map(([cc, nm]) =>
      `<span class="flag-chip"><i>${esc(cc.toUpperCase())}</i>${esc(nm)}</span>`).join("");
    const s = el("section", "slide");
    s.dataset.kind = "sheet";
    s.appendChild(el("div", "sheet", `
      <p class="eyebrow">Calendário</p>
      <h2>Quinze dias,<em>sem perder o fio.</em></h2>
      <div class="cal">${rows}</div>
      <p class="eyebrow" style="margin-top:46px">Os doze países</p>
      <div class="flags">${flags}</div>
      <p class="eyebrow" style="margin-top:46px">Como vamos viajar</p>
      <div class="log-grid">${logs}</div>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "sheet", scenes: [], accent: "#C9A24B", audio: "vienna" });
  }

  // fecho
  {
    const s = el("section", "slide");
    s.dataset.kind = "end";
    s.appendChild(stageFor([T.chapters[9].scenes[0]], "#A66B47"));
    s.appendChild(el("div", "end", `
      <p>${esc(T.meta.dedication)}</p>
      <span>${T.meta.start} a ${T.meta.end} de ${T.meta.month} de ${T.meta.year}</span>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "end", scenes: [T.chapters[9].scenes[0]], accent: "#A66B47", audio: "vienna" });
  }

  // trilho
  T.chapters.forEach((ch, i) => {
    const b = el("button", "rail-stop", `<b>${esc(ch.city)}</b>`);
    b.title = ch.city + " · " + ch.dates;
    b.addEventListener("click", () => go(i + 1));
    rail.appendChild(b);
  });

  // ---- estado --------------------------------------------------------------

  let idx = 0, scene = 0, timer = null, auto = true;

  function paintCanvas(slide, at) {
    const i = at == null ? (slide === slides[idx] ? scene : 0) : at;
    const sc = slide.scenes[i] || slide.scenes[0];
    if (!sc || !window.SceneArt) return;
    const canvas = slide.node.querySelector("canvas.art");
    if (canvas) {
      try { window.SceneArt.draw(canvas, sc, slide.accent); } catch (e) {}
    }
  }

  // a foto da cena atual chegou (ou falhou): mostra ou esconde a camada viva
  function sync() {
    const slide = slides[idx];
    if (!slide || !slide.scenes.length) return;
    const stage = slide.node.querySelector(".stage");
    const img = slide.node.querySelector('.stage img[data-i="' + scene + '"]');
    const shown = !!(img && !img.dataset.failed && img.getAttribute("src"));
    if (stage) stage.classList.toggle("has-photo", shown);
    slide.node.querySelectorAll(".stage img").forEach((im) => {
      const on = Number(im.dataset.i) === scene && !im.dataset.failed;
      im.classList.toggle("is-on", on);
      im.classList.toggle("is-out", !on);
    });
    const hud = slide.node.querySelector(".scene-hud .credit");
    const cr = slide.scenes[scene] && slide.scenes[scene].credit;
    if (hud && shown && cr && hud.tagName === "SPAN") writeCredit(slide, cr);
  }

  function writeCredit(slide, cr) {
    const old = slide.node.querySelector(".scene-hud .credit");
    if (!old) return;
    const a = el("a", "credit");
    a.href = cr.href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Foto: " + cr.by + " · " + cr.lic + " · Wikimedia Commons";
    old.replaceWith(a);
  }

  // aplica em todos os slides as fotos que o Commons já devolveu
  function refreshAll() {
    slides.forEach((s) => {
      s.scenes.forEach((sc, i) => {
        if (!sc.photo) return;
        const im = s.node.querySelector('.stage img[data-i="' + i + '"]');
        if (im && im.getAttribute("src") !== sc.photo) {
          delete im.dataset.failed;
          im.src = sc.photo;
        }
      });
    });
    sync();
  }

  function warm(n) {
    const s = slides[n];
    if (!s || !s.ch || !window.LivePhotos) return;
    window.LivePhotos.resolveChapter(s.ch, function (ch, i) {
      refreshAll();
      if (slides[idx] === s && i === scene) showScene(scene, false);
    });
  }

  function showScene(n, restart) {
    const slide = slides[idx];
    if (!slide.scenes.length) return;
    scene = (n + slide.scenes.length) % slide.scenes.length;
    const sc = slide.scenes[scene];

    paintCanvas(slide);
    if (window.Motion) window.Motion.play(slide.node.querySelector("canvas.motion"), sc);

    const cur = slide.node.querySelector('.stage img[data-i="' + scene + '"]');
    if (cur && sc.photo && cur.getAttribute("src") !== sc.photo) {
      delete cur.dataset.failed;
      cur.src = sc.photo;
    }
    sync();

    slide.node.querySelectorAll(".scene-row").forEach((row, i) => {
      row.classList.toggle("is-live", i === scene);
    });

    const hud = slide.node.querySelector(".scene-hud");
    if (hud) {
      const cr = sc.credit;
      const total = slide.scenes.length;
      const ticks = slide.scenes.map((_, i) =>
        `<i class="${i < scene ? "done" : i === scene ? "live" : ""}"></i>`).join("");
      const creditHtml = cr
        ? `<a class="credit" href="${esc(cr.href)}" target="_blank" rel="noopener">Foto: ${esc(cr.by)} · ${esc(cr.lic)} · Wikimedia Commons</a>`
        : `<span class="credit generated">Cena desenhada em tempo real</span>`;
      hud.innerHTML =
        `<span class="now"><i></i>${esc(sc.name)}</span>` +
        `<span class="ticks" style="--dur:${SCENE_MS}ms">${ticks}</span>` +
        `<span class="now" style="color:var(--bone-faint)">${String(scene + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</span>` +
        creditHtml;
    }

    if (restart !== false) arm();
  }

  function arm() {
    clearTimeout(timer);
    if (!auto) return;
    const slide = slides[idx];
    if (slide.scenes.length < 2) return;
    timer = setTimeout(() => showScene(scene + 1), SCENE_MS);
  }

  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === idx) return;
    slides[idx].node.classList.remove("is-on");
    idx = n; scene = 0;
    const slide = slides[idx];
    slide.node.classList.add("is-on");

    document.body.classList.toggle("is-cover", slide.kind === "cover");
    rail.querySelectorAll(".rail-stop").forEach((s, i) => {
      s.classList.toggle("here", i === idx - 1);
      s.classList.toggle("seen", i < idx - 1);
    });
    document.getElementById("prev").disabled = idx === 0;
    document.getElementById("next").disabled = idx === slides.length - 1;

    if (window.Ambience) window.Ambience.setChapter(slide.audio);

    if (slide.scenes.length) showScene(0);
    else { clearTimeout(timer); if (window.Motion) window.Motion.pause(); }

    warm(idx); warm(idx + 1);
    if (idx > 0 && hint) hint.style.opacity = "0";
  }

  // ---- controles -----------------------------------------------------------

  document.getElementById("next").addEventListener("click", () => go(idx + 1));
  document.getElementById("prev").addEventListener("click", () => go(idx - 1));

  document.getElementById("begin").addEventListener("click", () => {
    if (window.Ambience && window.Ambience.available()) {
      if (window.Ambience.start(slides[1].audio)) setSoundUI(true);
    }
    go(1);
  });

  function setSoundUI(on) {
    const b = document.getElementById("sound");
    b.setAttribute("aria-pressed", String(on));
    document.getElementById("sound-icon").innerHTML = on
      ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>'
      : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>';
  }
  document.getElementById("sound").addEventListener("click", () => {
    if (!window.Ambience || !window.Ambience.available()) return;
    setSoundUI(window.Ambience.toggle(slides[idx].audio) === true);
  });
  setSoundUI(false);

  document.getElementById("auto").addEventListener("click", (e) => {
    auto = !auto;
    e.currentTarget.setAttribute("aria-pressed", String(auto));
    document.getElementById("auto-icon").innerHTML = auto
      ? '<path d="M9 6v12M15 6v12"/>'
      : '<path d="M7 5l12 7-12 7z"/>';
    if (auto) arm(); else clearTimeout(timer);
  });

  document.getElementById("full").addEventListener("click", () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    }
  });

  // tocar na imagem troca de cena; tocar numa linha vai direto para ela
  deck.addEventListener("click", (e) => {
    const row = e.target.closest(".scene-row");
    if (row) { showScene(Number(row.dataset.scene)); return; }
    if (e.target.closest(".panel") || e.target.closest(".sheet") || e.target.closest("a") || e.target.closest("button")) return;
    if (slides[idx].scenes.length > 1) showScene(scene + 1);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(idx + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); showScene(scene + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); showScene(scene - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
  });

  let tx = 0, ty = 0, tt = 0;
  deck.addEventListener("touchstart", (e) => {
    tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; tt = Date.now();
  }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Date.now() - tt > 700) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (e.target.closest(".sheet")) return;
      go(idx + (dx < 0 ? 1 : -1));
    } else if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.4) {
      if (e.target.closest(".sheet")) return;
      if (slides[idx].scenes.length > 1) showScene(scene + (dy < 0 ? 1 : -1));
    }
  }, { passive: true });

  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      slides.forEach((s) => { if (s.scenes.length) paintCanvas(s); });
      if (window.Motion) window.Motion.resize();
    }, 180);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(timer); if (window.Motion) window.Motion.pause(); }
    else { arm(); if (window.Motion) window.Motion.resume(); }
  });

  // estado inicial
  slides[0].node.classList.add("is-on");
  document.body.classList.add("is-cover");
  document.getElementById("prev").disabled = true;
  slides.forEach((s) => { if (s.scenes.length) paintCanvas(s); });
  showScene(0);

  // busca as fotos da capa e das primeiras etapas assim que a página abre
  [1, 9, 7, 14, 2, 3].forEach((n, k) => setTimeout(() => warm(n), k * 260));
})();

</script>

</body>
</html>
