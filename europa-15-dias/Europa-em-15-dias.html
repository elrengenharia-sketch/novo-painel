<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090E">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Europa em 15 dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Martian+Mono:wght@400;600&display=swap">

<style>
:root{
  --ink:#07090E; --ink2:#0E131C; --ink3:#161D28;
  --bone:#EDE5D6; --bone-dim:#9E9689; --bone-faint:#5E5B55;
  --brass:#C9A24B; --signal:#A8352C;
  --accent:#3F7BA8;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --data:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pad:clamp(18px,4vw,56px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);
  font-family:var(--body);font-size:16px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* ---------- deck ---------- */
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .9s ease,visibility .9s;
  display:grid;
}
.slide.is-on{opacity:1;visibility:visible}

/* ---------- palco de imagem ---------- */
.stage{position:absolute;inset:0;overflow:hidden;background:var(--ink2)}
.stage canvas,.stage img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.stage canvas{z-index:1}
.stage img{
  z-index:2;opacity:0;transform:scale(1.08);
  transition:opacity 1.6s ease,transform 9s linear;
}
.stage img.is-on{opacity:1;transform:scale(1)}
.stage img.is-out{opacity:0;transform:scale(1.03);transition:opacity 1.6s ease}
.scrim{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    linear-gradient(to top,rgba(7,9,14,.94) 0%,rgba(7,9,14,.55) 30%,rgba(7,9,14,.1) 58%,rgba(7,9,14,.5) 100%),
    radial-gradient(120% 90% at 18% 60%,rgba(7,9,14,.86) 0%,rgba(7,9,14,0) 62%);
}
.tint{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;background:var(--accent)}

/* ---------- capa ---------- */
.hero-wrap{
  position:relative;z-index:4;height:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:var(--pad);padding-block:var(--pad);gap:clamp(14px,2vh,26px);
}
.eyebrow{
  font-family:var(--data);font-size:clamp(9px,1.1vw,11px);
  letter-spacing:.28em;text-transform:uppercase;color:var(--brass);margin:0;
}
.hero-title{
  font-family:var(--display);font-variation-settings:"opsz" 144,"SOFT" 40;
  font-weight:300;font-size:clamp(52px,12vw,168px);line-height:.84;
  letter-spacing:-.03em;margin:0;text-wrap:balance;
}
.hero-title em{font-style:normal;font-weight:900;display:block}
.hero-copy{max-width:44ch;color:var(--bone-dim);font-size:clamp(14px,1.6vw,19px);margin:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,52px);margin-top:clamp(6px,1.5vh,18px)}
.hero-meta div{display:flex;flex-direction:column;gap:2px}
.hero-meta strong{font-family:var(--data);font-size:clamp(18px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-meta span{font-family:var(--data);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-faint)}
.start{
  align-self:flex-start;margin-top:clamp(10px,2vh,22px);
  display:inline-flex;align-items:center;gap:14px;
  padding:16px 30px;border-radius:999px;
  background:var(--bone);color:var(--ink);
  font-family:var(--data);font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  transition:transform .25s,box-shadow .25s;
  box-shadow:0 10px 40px -12px rgba(237,229,214,.5);
}
.start:active{transform:scale(.97)}
.start .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- capítulo ---------- */
.chapter-body{
  position:relative;z-index:4;height:100%;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--pad);padding-block:var(--pad);
  pointer-events:none;
}
.slide[data-side="right"] .chapter-body{align-items:flex-end;text-align:right}
.slide[data-side="right"] .scrim{
  background:
    linear-gradient(to top,rgba(7,9,14,.94) 0%,rgba(7,9,14,.55) 30%,rgba(7,9,14,.1) 58%,rgba(7,9,14,.5) 100%),
    radial-gradient(120% 90% at 82% 60%,rgba(7,9,14,.86) 0%,rgba(7,9,14,0) 62%);
}
.panel{max-width:min(560px,92vw);pointer-events:auto}
.ch-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.slide[data-side="right"] .ch-head{justify-content:flex-end}
.ch-n{font-family:var(--data);font-size:11px;color:var(--brass);letter-spacing:.14em}
.ch-country{font-family:var(--data);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.ch-dates{
  font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:var(--brass);padding:4px 10px;border-radius:3px;
}
.ch-city{
  font-family:var(--display);font-variation-settings:"opsz" 144;
  font-weight:300;font-size:clamp(40px,8.4vw,104px);line-height:.88;
  letter-spacing:-.03em;margin:.14em 0 .1em;text-wrap:balance;
}
.ch-city em{font-style:normal;font-weight:900;font-size:.52em;display:block;color:var(--brass)}
.ch-intro{color:var(--bone-dim);font-size:clamp(13px,1.5vw,17px);max-width:52ch;margin:0 0 clamp(14px,2.4vh,26px)}
.slide[data-side="right"] .ch-intro{margin-left:auto}

/* lista de cenas — o texto que acompanha a imagem */
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;
  border-top:1px solid rgba(237,229,214,.14)}
.scene-row{
  display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;
  padding:11px 14px;border-bottom:1px solid rgba(237,229,214,.1);
  border-left:2px solid transparent;
  opacity:.42;transition:opacity .5s,background .5s,border-color .5s,padding .4s;
  text-align:left;width:100%;
}
.slide[data-side="right"] .scene-row{
  border-left:0;border-right:2px solid transparent;text-align:right;
  grid-template-columns:1fr auto;direction:rtl;
}
.slide[data-side="right"] .scene-row>*{direction:ltr}
.scene-row.is-live{
  opacity:1;background:rgba(237,229,214,.07);
  border-left-color:var(--accent);padding-left:20px;
}
.slide[data-side="right"] .scene-row.is-live{
  border-right-color:var(--accent);padding-left:14px;padding-right:20px;
}
.scene-time{
  font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.scene-name{font-family:var(--display);font-weight:600;font-size:clamp(15px,1.9vw,21px);
  letter-spacing:-.01em;grid-column:2;line-height:1.2}
.slide[data-side="right"] .scene-name{grid-column:1}
.scene-note{
  grid-column:2;font-size:13px;color:var(--bone-dim);line-height:1.45;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .6s ease,opacity .5s,margin .5s;
}
.slide[data-side="right"] .scene-note{grid-column:1}
.scene-row.is-live .scene-note{max-height:9em;opacity:1;margin-top:5px}

.transit{
  display:flex;gap:12px;align-items:flex-start;margin-top:clamp(12px,2vh,20px);
  font-size:12.5px;color:var(--bone-faint);max-width:54ch;
}
.slide[data-side="right"] .transit{margin-left:auto;flex-direction:row-reverse;text-align:right}
.transit b{
  font-family:var(--data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass);white-space:nowrap;padding-top:2px;
}

/* selo da cena + crédito */
.scene-hud{
  position:absolute;z-index:5;right:var(--pad);bottom:var(--pad);
  display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  pointer-events:auto;max-width:min(300px,44vw);
}
.slide[data-side="right"] .scene-hud{right:auto;left:var(--pad);align-items:flex-start}
.scene-hud .now{
  font-family:var(--data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);text-align:right;display:flex;align-items:center;gap:9px;
}
.slide[data-side="right"] .scene-hud .now{text-align:left;flex-direction:row-reverse}
.scene-hud .now i{
  font-style:normal;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);
  flex:none;
}
.ticks{display:flex;gap:5px}
.ticks i{display:block;width:26px;height:2px;background:rgba(237,229,214,.22);border-radius:2px;overflow:hidden}
.ticks i.done{background:rgba(237,229,214,.5)}
.ticks i.live{background:rgba(237,229,214,.22)}
.ticks i.live::after{
  content:"";display:block;height:100%;width:0;background:var(--accent);
  animation:fill var(--dur,7s) linear forwards;
}
@keyframes fill{to{width:100%}}
.credit{
  font-family:var(--data);font-size:9px;letter-spacing:.06em;
  color:var(--bone-faint);text-decoration:none;text-align:right;line-height:1.5;
}
.slide[data-side="right"] .credit{text-align:left}
.credit:hover,.credit:focus{color:var(--bone-dim);text-decoration:underline}
.credit.generated{color:#4C4A46}

/* ---------- calendário ---------- */
.sheet{
  position:relative;z-index:4;height:100%;overflow-y:auto;
  padding:var(--pad);padding-block:calc(var(--pad) + 34px);
  background:
    radial-gradient(90% 60% at 50% 0%,rgba(63,123,168,.16) 0%,rgba(7,9,14,0) 70%),
    var(--ink);
  -webkit-overflow-scrolling:touch;
}
.sheet h2{
  font-family:var(--display);font-weight:300;font-size:clamp(32px,6vw,68px);
  line-height:.92;letter-spacing:-.03em;margin:.2em 0 .5em;text-wrap:balance;
}
.sheet h2 em{font-style:normal;font-weight:900}
.cal{display:grid;gap:1px;background:rgba(237,229,214,.12);border:1px solid rgba(237,229,214,.12)}
.cal-row{
  display:grid;grid-template-columns:78px 1fr;gap:0;
  background:var(--ink);align-items:stretch;
}
.cal-day{
  font-family:var(--data);font-weight:600;font-size:clamp(16px,2.4vw,24px);
  font-variant-numeric:tabular-nums;color:var(--brass);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:14px 8px;border-right:1px solid rgba(237,229,214,.12);gap:3px;
}
.cal-day small{font-size:8px;letter-spacing:.16em;color:var(--bone-faint)}
.cal-main{padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-place{font-family:var(--display);font-weight:600;font-size:clamp(15px,2vw,20px)}
.cal-detail{font-size:13px;color:var(--bone-dim)}
.cal-route{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-faint);margin-top:2px}

.log-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px;margin-top:36px}
.log-item{border-top:2px solid var(--brass);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.log-item h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.log-item p{margin:0;font-size:13.5px;color:var(--bone-dim)}

/* ---------- fecho ---------- */
.end{
  position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:18px;
  padding:var(--pad);padding-block:var(--pad);
}
.end p{
  font-family:var(--display);font-weight:300;font-style:italic;
  font-size:clamp(24px,5vw,56px);line-height:1.15;letter-spacing:-.02em;
  max-width:20ch;margin:0;text-wrap:balance;
}
.end span{font-family:var(--data);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}

/* ---------- trilho de navegação ---------- */
.rail{
  position:fixed;z-index:20;left:0;right:0;top:0;
  display:flex;align-items:center;gap:2px;
  padding:10px var(--pad);
  background:linear-gradient(to bottom,rgba(7,9,14,.85),rgba(7,9,14,0));
  pointer-events:auto;
}
.rail-stop{
  flex:1;height:26px;display:flex;align-items:center;justify-content:center;
  position:relative;min-width:0;
}
.rail-stop::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  background:rgba(237,229,214,.16);transform:translateY(-50%);
}
.rail-stop.seen::before{background:rgba(237,229,214,.45)}
.rail-stop.here::before{background:var(--accent)}
.rail-stop b{
  position:relative;z-index:1;font-family:var(--data);font-size:8.5px;
  letter-spacing:.08em;color:var(--bone-faint);background:var(--ink);
  padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .3s;
}
.rail-stop.here b{color:var(--bone);font-weight:600}
.rail-stop.seen b{color:var(--bone-dim)}

/* ---------- controles ---------- */
.hud{
  position:fixed;z-index:22;left:var(--pad);bottom:var(--pad);
  display:flex;gap:8px;align-items:center;
}
.slide-hero ~ .hud{}
.hud button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(237,229,214,.22);
  display:grid;place-items:center;
  background:rgba(7,9,14,.55);backdrop-filter:blur(8px);
  transition:border-color .3s,background .3s;
}
.hud button:active{background:rgba(237,229,214,.14)}
.hud button[aria-pressed="true"]{border-color:var(--brass)}
.hud svg{width:17px;height:17px;fill:none;stroke:var(--bone);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.hud button[aria-pressed="true"] svg{stroke:var(--brass)}

.arrows{position:fixed;z-index:21;right:var(--pad);bottom:var(--pad);display:flex;gap:8px}
.arrows button{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(237,229,214,.22);display:grid;place-items:center;
  background:rgba(7,9,14,.55);backdrop-filter:blur(8px);
}
.arrows button:disabled{opacity:.3}
.arrows svg{width:18px;height:18px;fill:none;stroke:var(--bone);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.hint{
  position:fixed;z-index:21;left:50%;bottom:calc(var(--pad) + 6px);transform:translateX(-50%);
  font-family:var(--data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bone-faint);pointer-events:none;transition:opacity .6s;white-space:nowrap;
}

.is-cover .rail,.is-cover .arrows,.is-cover .hint{opacity:0;pointer-events:none}
.rail,.arrows,.hint,.hud{transition:opacity .6s}

@media (max-width:760px){
  .scene-hud{
    left:var(--pad);right:var(--pad);bottom:auto;top:calc(var(--pad) + 26px);
    align-items:flex-start;max-width:none;
  }
  .slide[data-side="right"] .scene-hud{left:var(--pad);right:var(--pad)}
  .slide[data-side="right"] .chapter-body{align-items:flex-start;text-align:left}
  .slide[data-side="right"] .scene-row{
    border-right:0;border-left:2px solid transparent;text-align:left;
    grid-template-columns:auto 1fr;direction:ltr;
  }
  .slide[data-side="right"] .scene-row.is-live{border-left-color:var(--accent);padding-left:20px;padding-right:14px}
  .slide[data-side="right"] .scene-name,.slide[data-side="right"] .scene-note{grid-column:2}
  .slide[data-side="right"] .ch-head{justify-content:flex-start}
  .slide[data-side="right"] .ch-intro,.slide[data-side="right"] .transit{margin-left:0}
  .slide[data-side="right"] .transit{flex-direction:row;text-align:left}
  .chapter-body{padding-bottom:calc(var(--pad) + 56px)}
  .scene-note{display:none}
  .hint{display:none}
  .cal-row{grid-template-columns:60px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .stage img{transform:none!important}
}
</style>

</head>
<body>
<div class="deck" id="deck"></div>

<nav class="rail" id="rail" aria-label="Etapas da viagem"></nav>

<div class="hud">
  <button id="sound" aria-pressed="false" aria-label="Ligar ou desligar o som ambiente" title="Som ambiente">
    <svg viewBox="0 0 24 24" id="sound-icon"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6" class="wave"/></svg>
  </button>
  <button id="full" aria-label="Entrar em tela cheia" title="Tela cheia">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="auto" aria-pressed="true" aria-label="Pausar ou retomar a passagem automática" title="Passagem automática">
    <svg viewBox="0 0 24 24" id="auto-icon"><path d="M9 6v12M15 6v12"/></svg>
  </button>
</div>

<div class="arrows">
  <button id="prev" aria-label="Etapa anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="next" aria-label="Próxima etapa"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<p class="hint" id="hint">deslize ou use as setas · toque na imagem para trocar de cena</p>

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---- silhuetas ------------------------------------------------------------

  function silTower(ctx, x, base, w, h, p, r) {
    const cx = x + w / 2, topW = w * (p.gate ? 0.5 : 0.16);
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, base);
    ctx.lineTo(cx - topW / 2, base - h);
    ctx.lineTo(cx + topW / 2, base - h);
    ctx.lineTo(cx + w / 2, base);
    ctx.closePath(); ctx.fill();
    if (p.gate) {
      ctx.beginPath();
      ctx.moveTo(cx - topW / 2, base - h);
      ctx.lineTo(cx, base - h - h * 0.28);
      ctx.lineTo(cx + topW / 2, base - h);
      ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx, base - w * 0.34, w * 0.2, Math.PI, 0); ctx.rect(cx - w * 0.2, base - w * 0.34, w * 0.4, w * 0.34);

      ctx.globalCompositeOperation = "source-over";

      ctx.arc(cx, base, w * 0.44, Math.PI, 0); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function silSpires(ctx, x, base, w, h, p, r) {
    const n = p.count || 2, body = h * (p.wide ? 0.42 : 0.5);
    ctx.fillRect(x, base - body, w, body);
    for (let i = 0; i < n; i++) {
      const cx = x + w * ((i + 0.5) / n);
      const sh = h * (p.spiky ? (0.55 + r() * 0.45) : (i % 2 ? 0.82 : 1));
      const sw = w / n * (p.spiky ? 0.16 : 0.34);
      ctx.beginPath();
      ctx.moveTo(cx - sw, base - body);
      ctx.lineTo(cx, base - body - sh);
      ctx.lineTo(cx + sw, base - body - sh * (p.spiky ? 1 : 0.98));
      ctx.closePath(); ctx.fill();
    }
    if (p.clock) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath(); ctx.arc(x + w * 0.5, base - body * 0.58, w * 0.07, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalCompositeOperation = "destination-out";
    const cols = Math.max(4, Math.round(w / 34));
    for (let i = 0; i < cols; i++) {
      const wx = x + w * ((i + 0.5) / cols);
      ctx.beginPath();
      ctx.arc(wx, base - body * 0.34, w / cols * 0.14, Math.PI, 0);
      ctx.rect(wx - w / cols * 0.14, base - body * 0.34, w / cols * 0.28, body * 0.3);

    ctx.globalCompositeOperation = "source-over";
  }

  function silPalace(ctx, x, base, w, h, p, r) {
    const body = h * 0.62;
    ctx.fillRect(x, base - body, w, body);
    if (p.dome) {
      const cx = x + w / 2, dr = w * 0.11;
      ctx.beginPath(); ctx.arc(cx, base - body, dr, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - dr * 0.16, base - body - dr - h * 0.12, dr * 0.32, h * 0.12);
    } else {
      ctx.beginPath();
      ctx.moveTo(x + w * 0.38, base - body);
      ctx.lineTo(x + w * 0.5, base - body - h * 0.13);
      ctx.lineTo(x + w * 0.62, base - body);
      ctx.closePath(); ctx.fill();
    }
    const tw = p.towers || 0;
    for (let i = 0; i < tw; i++) {
      const cx = x + w * ((i + 0.5) / tw), tw2 = w * 0.05;
      ctx.fillRect(cx - tw2 / 2, base - body - h * 0.2, tw2, h * 0.2);
      if (p.blocky) { ctx.beginPath(); ctx.moveTo(cx - tw2, base - body - h * 0.2); ctx.lineTo(cx, base - body - h * 0.32); ctx.lineTo(cx + tw2, base - body - h * 0.2); ctx.closePath(); ctx.fill(); }
    }
    ctx.globalCompositeOperation = "destination-out";
    const cols = Math.max(8, Math.round(w / 26));
    for (let i = 0; i < cols; i++) {
      const wx = x + w * ((i + 0.5) / cols), ww = w / cols * 0.3;
      ctx.beginPath();
      ctx.arc(wx, base - body * 0.52, ww, Math.PI, 0);
      ctx.rect(wx - ww, base - body * 0.52, ww * 2, body * 0.3);
      ctx.fill();
    }

      }
    }
  }

  function silHouses(ctx, x, base, w, h, p, r) {
    const n = Math.max(6, Math.round(w / (p.narrow ? 46 : 72)));
    for (let i = 0; i < n; i++) {
      const bw = w / n, bx = x + i * bw;
      const bh = h * (p.low ? 0.34 + r() * 0.26 : 0.5 + r() * 0.42);
      ctx.fillRect(bx + bw * 0.06, base - bh, bw * 0.88, bh);

        ctx.moveTo(bx, base - bh); ctx.lineTo(bx + bw / 2, base - bh - bw * 0.4); ctx.lineTo(bx + bw, base - bh);

        let sy = base - bh;
        for (let s = 0; s < 3; s++) {
          const inset = bw * (0.1 + s * 0.13);
          ctx.fillRect(bx + inset, sy - bw * 0.12, bw - inset * 2, bw * 0.13);

        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.06, base - bh);
        ctx.quadraticCurveTo(bx + bw / 2, base - bh - bw * 0.55, bx + bw * 0.94, base - bh);

    }
    ctx.globalCompositeOperation = "destination-out";
    for (let i = 0; i < n * 3; i++) {
      const wx = x + w * (i + 0.5) / (n * 3);

    const n = p.arches || 4, deck = base - h * 0.42, span = w / n;

    for (let i = 0; i < n; i++) {
      const cx = x + span * (i + 0.5);

      ctx.arc(cx + span * 0.5, deck + h * 0.1, span * 0.38, Math.PI, 0);

      ctx.globalCompositeOperation = "source-over";
    }
    if (p.pylon) {
      const cx = x + w * 0.62;
      ctx.fillRect(cx - w * 0.012, base - h * 1.15, w * 0.024, h * 1.15);
      ctx.beginPath(); ctx.arc(cx, base - h * 1.18, w * 0.05, 0, 7); ctx.fill();

    }

      ctx.lineWidth = Math.max(1, w * 0.004); ctx.strokeStyle = ctx.fillStyle;

        ctx.moveTo(cx, deck); ctx.lineTo(cx + span * 0.5, deck - h * 0.2); ctx.lineTo(cx + span, deck);

      [x + w * 0.04, x + w * 0.92].forEach((tx) => {

      for (let i = 1; i < n; i++) {
        const sx = x + span * i;

    }
  }

  function silHill(ctx, x, base, w, h, p, r) {
    ctx.beginPath();
    ctx.moveTo(x, base);

    ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();

      const cx = x + w * peak, cw = w * 0.17, cb = base - h * 0.9;
      ctx.fillRect(cx - cw / 2, cb - h * 0.16, cw, h * 0.16);

        ctx.moveTo(tx - cw * 0.03, cb - h * 0.26); ctx.lineTo(tx + cw * 0.055, cb - h * 0.34); ctx.lineTo(tx + cw * 0.14, cb - h * 0.26);
        ctx.closePath(); ctx.fill();
      }
    }
    if (p.town) {
      for (let i = 0; i < 14; i++) {
        const tx = x + w * (0.06 + r() * 0.88);

  function silMountain(ctx, x, base, w, h, p, r, snowColor) {
    const n = p.peaks || 4;

      const px = x + w * (i / n);
      const py = base - h * (0.35 + r() * 0.62);

        ctx.moveTo(cx - bw / 2, base);
        ctx.lineTo(cx - bw / 2, base - bh * 0.5);
        ctx.arc(cx, base - bh * 0.5, bw / 2, Math.PI, 0);
        ctx.lineTo(cx + bw / 2, base);
      }
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (p.glass) {
      ctx.globalAlpha = 0.25;
      for (let i = 0; i < 9; i++) {
        const gx = x + w * 0.5 + (i - 4) * w * 0.05;

      }
      ctx.globalAlpha = 1;
    }
  }

  function silWater(ctx, x, base, w, h, p, r) {
    ctx.fillRect(x, base - h * 0.18, w, h * 0.18);
    if (p.dome) {
      const cx = x + w * 0.72, dr = w * 0.07;
      ctx.beginPath(); ctx.arc(cx, base - h * 0.18, dr, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - dr * 0.12, base - h * 0.18 - dr - h * 0.09, dr * 0.24, h * 0.09);
    }
    for (let i = 0; i < 10; i++) {
      const bx = x + w * (i / 10) + w * 0.01;
      ctx.fillRect(bx, base - h * (0.18 + r() * 0.22), w * 0.035, h * 0.22);
    }
    const boats = p.boats || 0;
    for (let i = 0; i < boats; i++) {
      const bx = x + w * (0.2 + i * 0.28), by = base + h * 0.1;
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.05, by); ctx.quadraticCurveTo(bx, by + h * 0.05, bx + w * 0.05, by);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx - w * 0.002, by - h * 0.09, w * 0.004, h * 0.09);
    }
  }

  const DRAW = {
    tower: silTower, spires: silSpires, palace: silPalace, houses: silHouses,
    bridge: silBridge, hill: silHill, mountain: silMountain, vault: silVault, water: silWater
  };

  // ---- composição -----------------------------------------------------------

  function draw(canvas, scene, accentHex) {
    const box = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.max(2, Math.round(box.width)), H = Math.max(2, Math.round(box.height));
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const art = scene.art || {};
    const pal = SKY[art.sky] || SKY.dusk;
    const [arch, params] = KIND[art.kind] || ["houses", {}];
    const r = rng(hash(scene.name + art.kind));
    const interior = art.sky === "interior" || art.sky === "underground";
    const horizon = interior ? H * 0.9 : H * (art.water ? 0.62 : 0.74);

    // céu
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, pal[0]); g.addColorStop(0.45, pal[1]);
    g.addColorStop(0.8, pal[2]); g.addColorStop(1, pal[3]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);

    // disco de luz
    const sunX = W * (0.2 + r() * 0.6), sunY = horizon - H * (0.08 + r() * 0.18);
    const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.55);
    sg.addColorStop(0, art.sky === "night" ? "rgba(210,225,255,.5)" : "rgba(255,240,215,.62)");
    sg.addColorStop(0.35, "rgba(255,230,190,.14)");
    sg.addColorStop(1, "rgba(255,230,190,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, horizon + 2);
    if (!interior) {
      ctx.beginPath(); ctx.arc(sunX, sunY, H * (art.sky === "night" ? 0.022 : 0.034), 0, 7);
      ctx.fillStyle = art.sky === "night" ? "rgba(226,236,255,.92)" : "rgba(255,247,228,.9)";
      ctx.fill();
    }

    // chão / água
    ctx.fillStyle = art.water ? mix(pal[3], pal[0], 0.62) : mix(pal[3], "#0b0e13", 0.72);
    ctx.fillRect(0, horizon, W, H - horizon);

    // camadas de silhueta, do fundo para a frente
    const layers = interior ? 1 : 3;
    for (let L = 0; L < layers; L++) {
      const t = layers === 1 ? 1 : L / (layers - 1);
      const depth = 0.3 + t * 0.7;
      const base = horizon + (H - horizon) * (interior ? 0 : t * 0.14);
      const h = H * (interior ? 0.8 : (0.2 + depth * 0.26));
      const inset = (1 - depth) * W * 0.12;
      ctx.fillStyle = mix(pal[2], L === layers - 1 ? accentHex : pal[0], 0.42 + t * 0.5);
      ctx.save();
      DRAW[arch](ctx, -inset, base, W + inset * 2, h, L === layers - 1 ? params : { ...params, low: 1 }, r,
        mix("#ffffff", pal[3], 0.18));
      ctx.restore();

      // reflexo na água
      if (art.water && L === layers - 1 && !interior) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.translate(0, base * 2); ctx.scale(1, -1);
        ctx.fillStyle = mix(pal[2], accentHex, 0.7);
        DRAW[arch](ctx, -inset, base, W + inset * 2, h * 0.92, params, rng(hash(scene.name)), null);
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.fillStyle = mix(pal[3], pal[0], 0.55);
        for (let i = 0; i < 26; i++) {
          const wy = base + (H - base) * Math.pow(i / 26, 1.5);
          ctx.globalAlpha = 0.16 + (i / 26) * 0.2;
          ctx.fillRect(W * r() * 0.9, wy, W * (0.05 + r() * 0.22), Math.max(1, H * 0.004));
        }
        ctx.globalAlpha = 1;
      }
    }

    // névoa
    const hg = ctx.createLinearGradient(0, horizon - H * 0.22, 0, horizon + H * 0.06);
    hg.addColorStop(0, "rgba(255,255,255,0)");
    hg.addColorStop(1, art.sky === "night" ? "rgba(40,60,95,.34)" : "rgba(255,244,226,.3)");
    ctx.fillStyle = hg; ctx.fillRect(0, horizon - H * 0.22, W, H * 0.28);

    // vinheta + granulado
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.2, W / 2, H * 0.5, H * 0.95);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,6,11,.62)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.05;
    for (let i = 0; i < (W * H) / 700; i++) {
      ctx.fillStyle = r() > 0.5 ? "#fff" : "#000";
      ctx.fillRect(r() * W, r() * H, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  window.SceneArt = { draw: draw };
})();

// Ambiente sonoro sintetizado: um acorde e uma textura por capítulo.
// Sem arquivos externos — funciona offline e só começa depois de um gesto do usuário.
(function () {
  "use strict";

  // root = nota base (Hz) · chord = intervalos em semitons · air = ruído (0–1)
  // bell = intervalo médio entre sinos (s, 0 = sem sino) · cut = corte do filtro (Hz)
  const MOODS = {
    paris:      { root: 146.83, chord: [0, 7, 16, 23], wave: "sawtooth", air: 0.10, bell: 0,  cut: 900,  q: 3 },
    brussels:   { root: 130.81, chord: [0, 7, 12, 16], wave: "triangle", air: 0.08, bell: 0,  cut: 820,  q: 2 },
    amsterdam:  { root: 110.00, chord: [0, 7, 14, 21], wave: "sine",     air: 0.30, bell: 0,  cut: 1500, q: 1 },
    cologne:    { root: 98.00,  chord: [0, 7, 12, 19], wave: "sine",     air: 0.06, bell: 11, cut: 700,  q: 4 },
    luxembourg: { root: 123.47, chord: [0, 5, 12, 17], wave: "triangle", air: 0.12, bell: 0,  cut: 640,  q: 3 },
    strasbourg: { root: 138.59, chord: [0, 4, 11, 16], wave: "sawtooth", air: 0.09, bell: 14, cut: 880,  q: 3 },
    lucerne:    { root: 164.81, chord: [0, 7, 12, 19], wave: "sine",     air: 0.34, bell: 0,  cut: 2200, q: 1 },
    italy:      { root: 155.56, chord: [0, 4, 7, 14],  wave: "sawtooth", air: 0.22, bell: 0,  cut: 1200, q: 2 },
    vienna:     { root: 130.81, chord: [0, 4, 7, 16],  wave: "sawtooth", air: 0.07, bell: 0,  cut: 1000, q: 3 },
    budapest:   { root: 116.54, chord: [0, 3, 10, 15], wave: "triangle", air: 0.26, bell: 0,  cut: 760,  q: 3 },
    bratislava: { root: 110.00, chord: [0, 5, 10, 17], wave: "sine",     air: 0.16, bell: 0,  cut: 820,  q: 2 },
    krakow:     { root: 103.83, chord: [0, 3, 7, 14],  wave: "triangle", air: 0.10, bell: 17, cut: 600,  q: 4 },
    prague:     { root: 98.00,  chord: [0, 3, 10, 14], wave: "sawtooth", air: 0.12, bell: 9,  cut: 720,  q: 4 }
  };

  let ctx = null, master = null, verb = null, dry = null;
  let voices = [], noiseGain = null, noiseFilter = null, bellTimer = null;
  let current = null, enabled = false;

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    verb = ctx.createConvolver();
    verb.buffer = impulse(3.4, 2.6);
    const verbGain = ctx.createGain();
    verbGain.gain.value = 0.55;
    verb.connect(verbGain); verbGain.connect(master);

    dry = ctx.createGain();
    dry.gain.value = 0.65;
    dry.connect(master);

    // leito de ruído (água, vento, sala)
    const len = ctx.sampleRate * 4;
    const nb = ctx.createBuffer(1, len, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      nd[i] = last * 3.2;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = nb; noise.loop = true;
    noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "bandpass"; noiseFilter.frequency.value = 700; noiseFilter.Q.value = 0.7;
    noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain);
    noiseGain.connect(dry); noiseGain.connect(verb);
    noise.start();

    // LFO lento na frequência do filtro: dá movimento de respiração
    const lfo = ctx.createOscillator(), lfoAmt = ctx.createGain();
    lfo.frequency.value = 0.06; lfoAmt.gain.value = 240;
    lfo.connect(lfoAmt); lfoAmt.connect(noiseFilter.frequency);
    lfo.start();
    return true;
  }

  function clearVoices(t) {
    voices.forEach((v) => {
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setTargetAtTime(0, t, 0.9);
      try { v.osc.stop(t + 4); } catch (e) {}
    });
    voices = [];
  }

  function apply(id) {
    if (!ctx || !enabled) return;
    const m = MOODS[id] || MOODS.paris;
    const t = ctx.currentTime;
    clearVoices(t);
    if (bellTimer) { clearInterval(bellTimer); bellTimer = null; }

    m.chord.forEach((semi, i) => {
      const osc = ctx.createOscillator();
      osc.type = m.wave;
      osc.frequency.value = m.root * Math.pow(2, semi / 12);
      osc.detune.value = (i % 2 ? 1 : -1) * (4 + i * 2);

      const filt = ctx.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.value = m.cut; filt.Q.value = m.q;

      const g = ctx.createGain();
      g.gain.value = 0;
      g.gain.setTargetAtTime(0.16 / (i + 1.3), t, 2.2);

      // leve oscilação de amplitude por voz
      const trem = ctx.createOscillator(), tremAmt = ctx.createGain();
      trem.frequency.value = 0.05 + i * 0.017;
      tremAmt.gain.value = 0.03;
      trem.connect(tremAmt); tremAmt.connect(g.gain); trem.start();

      osc.connect(filt); filt.connect(g);
      g.connect(dry); g.connect(verb);
      osc.start();
      voices.push({ osc: osc, gain: g });
    });

    noiseGain.gain.setTargetAtTime(m.air * 0.32, t, 2.5);
    noiseFilter.frequency.setTargetAtTime(m.cut * 1.4, t, 2.5);

    if (m.bell) {
      const ring = () => {
        if (!enabled || !ctx) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = m.root * Math.pow(2, (m.chord[1 + Math.floor(Math.random() * 2)] + 24) / 12);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 5.5);
        o.connect(g); g.connect(verb); g.connect(dry);
        o.start(now); o.stop(now + 6);
      };
      bellTimer = setInterval(ring, m.bell * 1000);
      setTimeout(ring, 1800);
    } else {
      noiseGain.gain.setTargetAtTime(m.air * 0.32, t, 2.5);
    }
    current = id;
  }

  const Ambience = {
    get enabled() { return enabled; },
    available: function () { return !!(window.AudioContext || window.webkitAudioContext); },
    start: function (id) {
      if (!ctx && !build()) return false;
      if (ctx.state === "suspended") ctx.resume();
      enabled = true;
      master.gain.setTargetAtTime(0.5, ctx.currentTime, 1.6);
      apply(id || current || "paris");
      return true;
    },
    stop: function () {
      if (!ctx) return;
      enabled = false;
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.6);
      if (bellTimer) { clearInterval(bellTimer); bellTimer = null; }
    },
    toggle: function (id) {
      if (enabled) { this.stop(); return false; }
      return this.start(id);
    },
    setChapter: function (id) {
      if (id === current) return;
      if (!enabled) { current = id; return; }
      apply(id);
    }
  };

  window.Ambience = Ambience;
})();

/* ===== app.js ===== */
(function () {
  "use strict";

  const T = window.TRIP;
  const deck = document.getElementById("deck");
  const rail = document.getElementById("rail");
  const hint = document.getElementById("hint");
  const SCENE_MS = 7000;

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---- montagem dos slides -------------------------------------------------

  const slides = [];

  function stageFor(scenes, accent) {
    const stage = el("div", "stage");
    const canvas = el("canvas");
    canvas.setAttribute("aria-hidden", "true");
    stage.appendChild(canvas);
    scenes.forEach((sc, i) => {
      const img = el("img");
      img.alt = sc.name;
      img.decoding = "async";
      img.loading = i === 0 ? "eager" : "lazy";
      img.dataset.i = i;
      if (sc.photo) {
        img.addEventListener("error", () => { img.dataset.failed = "1"; }, { once: true });
        img.src = sc.photo;
      } else {
        img.dataset.failed = "1";
      }
      stage.appendChild(img);
    });
    const tint = el("div", "tint");
    tint.style.background = accent;
    stage.appendChild(tint);
    stage.appendChild(el("div", "scrim"));
    return stage;
  }

  // capa
  const coverScenes = [
    T.chapters[12].scenes[1], // Praga
    T.chapters[7].scenes[2],  // Veneza
    T.chapters[9].scenes[1],  // Budapeste
    T.chapters[6].scenes[1]   // Titlis
  ];
  {
    const s = el("section", "slide slide-hero");
    s.dataset.kind = "cover";
    s.appendChild(stageFor(coverScenes, "#3F7BA8"));
    s.appendChild(el("div", "hero-wrap", `
      <p class="eyebrow">Uma viagem para nós dois</p>
      <h1 class="hero-title">Europa<em>em 15 dias</em></h1>
      <p class="hero-copy">Do primeiro café em Paris à última noite em Viena.
        Doze países ligados por trilhos, cidades e histórias — entre
        ${T.meta.start} e ${T.meta.end} de ${T.meta.month} de ${T.meta.year}.</p>
      <div class="hero-meta">
        <div><strong>${T.meta.start}&#8202;–&#8202;${T.meta.end}</strong><span>${T.meta.month} ${T.meta.year}</span></div>
        <div><strong>${T.meta.countries}</strong><span>países</span></div>
        <div><strong>${T.meta.stops}</strong><span>destinos</span></div>
        <div><strong>${T.meta.days}</strong><span>dias</span></div>
      </div>
      <button class="start" id="begin"><span class="dot"></span> Iniciar a viagem</button>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "cover", scenes: coverScenes, accent: "#3F7BA8", audio: "paris" });
  }

  // capítulos
  T.chapters.forEach((ch, ci) => {
    const s = el("section", "slide slide-chapter");
    s.dataset.kind = "chapter";
    s.dataset.side = ci % 2 ? "right" : "left";
    s.style.setProperty("--accent", ch.accent);
    s.appendChild(stageFor(ch.scenes, ch.accent));

    const rows = ch.scenes.map((sc, i) => `
      <li>
        <button class="scene-row" data-scene="${i}">
          <span class="scene-time">${esc(sc.time)}</span>
          <span class="scene-name">${esc(sc.name)}</span>
          <span class="scene-note">${esc(sc.note)}</span>
        </button>
      </li>`).join("");

    s.appendChild(el("div", "chapter-body", `
      <div class="panel">
        <div class="ch-head">
          <span class="ch-n">${ch.n} / 13</span>
          <span class="ch-country">${esc(ch.country)}</span>
          <span class="ch-dates">${esc(ch.days)} · ${esc(ch.dates)}</span>
        </div>
        <h2 class="ch-city">${esc(ch.city)}${ch.sub ? `<em>${esc(ch.sub)}</em>` : ""}</h2>
        <p class="ch-intro">${esc(ch.intro)}</p>
        <ul class="scenes">${rows}</ul>
        <p class="transit"><b>Como seguir</b><span>${esc(ch.transit)}</span></p>
      </div>
    `));
    s.appendChild(el("div", "scene-hud"));
    deck.appendChild(s);
    slides.push({ node: s, kind: "chapter", scenes: ch.scenes, accent: ch.accent, audio: ch.id, ch: ch });
  });

  // calendário + logística
  {
    const rows = T.calendar.map((d) => `
      <div class="cal-row">
        <div class="cal-day">${d.d}<small>ABR</small></div>
        <div class="cal-main">
          <span class="cal-place">${esc(d.place)}</span>
          <span class="cal-detail">${esc(d.detail)}</span>
          <span class="cal-route">${esc(d.route)}</span>
        </div>
      </div>`).join("");
    const logs = T.logistics.map((l) => `
      <div class="log-item"><h3>${esc(l.t)}</h3><p>${esc(l.d)}</p></div>`).join("");
    const s = el("section", "slide");
    s.dataset.kind = "sheet";
    s.appendChild(el("div", "sheet", `
      <p class="eyebrow">Calendário</p>
      <h2>Quinze dias,<em>sem perder o fio.</em></h2>
      <div class="cal">${rows}</div>
      <p class="eyebrow" style="margin-top:44px">Logística</p>
      <div class="log-grid">${logs}</div>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "sheet", scenes: [], accent: "#C9A24B", audio: "vienna" });
  }

  // fecho
  {
    const s = el("section", "slide");
    s.dataset.kind = "end";
    s.appendChild(stageFor([T.chapters[8].scenes[0]], "#A66B47"));
    s.appendChild(el("div", "end", `
      <p>${esc(T.meta.dedication)}</p>
      <span>${T.meta.start} a ${T.meta.end} de ${T.meta.month} de ${T.meta.year}</span>
    `));
    deck.appendChild(s);
    slides.push({ node: s, kind: "end", scenes: [T.chapters[8].scenes[0]], accent: "#A66B47", audio: "vienna" });
  }

  // trilho
  T.chapters.forEach((ch, i) => {
    const b = el("button", "rail-stop", `<b>${esc(ch.city)}</b>`);
    b.title = ch.city + " · " + ch.dates;
    b.addEventListener("click", () => go(i + 1));
    rail.appendChild(b);
  });

  // ---- estado --------------------------------------------------------------

  let idx = 0, scene = 0, timer = null, auto = true;

  function paintCanvas(slide, at) {
    const i = at == null ? (slide === slides[idx] ? scene : 0) : at;
    const sc = slide.scenes[i] || slide.scenes[0];
    if (!sc || !window.SceneArt) return;
    const canvas = slide.node.querySelector("canvas");
    if (canvas) {
      try { window.SceneArt.draw(canvas, sc, slide.accent); } catch (e) {}
    }
  }

  function showScene(n, restart) {
    const slide = slides[idx];
    if (!slide.scenes.length) return;
    scene = (n + slide.scenes.length) % slide.scenes.length;
    const sc = slide.scenes[scene];

    paintCanvas(slide);

    slide.node.querySelectorAll(".stage img").forEach((img) => {
      const on = Number(img.dataset.i) === scene && !img.dataset.failed;
      img.classList.toggle("is-on", on);
      img.classList.toggle("is-out", !on);
    });

    slide.node.querySelectorAll(".scene-row").forEach((row, i) => {
      row.classList.toggle("is-live", i === scene);
    });

    const hud = slide.node.querySelector(".scene-hud");
    if (hud) {
      const cr = sc.credit;
      const total = slide.scenes.length;
      const ticks = slide.scenes.map((_, i) =>
        `<i class="${i < scene ? "done" : i === scene ? "live" : ""}"></i>`).join("");
      const creditHtml = cr
        ? `<a class="credit" href="${esc(cr.href)}" target="_blank" rel="noopener">Foto: ${esc(cr.by)} · ${esc(cr.lic)} · Wikimedia Commons</a>`
        : `<span class="credit generated">Cena desenhada em tempo real</span>`;
      hud.innerHTML =
        `<span class="now"><i></i>${esc(sc.name)}</span>` +
        `<span class="ticks" style="--dur:${SCENE_MS}ms">${ticks}</span>` +
        `<span class="now" style="color:var(--bone-faint)">${String(scene + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</span>` +
        creditHtml;
    }

    if (restart !== false) arm();
  }

  function arm() {
    clearTimeout(timer);
    if (!auto) return;
    const slide = slides[idx];
    if (slide.scenes.length < 2) return;
    timer = setTimeout(() => showScene(scene + 1), SCENE_MS);
  }

  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === idx) return;
    slides[idx].node.classList.remove("is-on");
    idx = n; scene = 0;
    const slide = slides[idx];
    slide.node.classList.add("is-on");

    document.body.classList.toggle("is-cover", slide.kind === "cover");
    rail.querySelectorAll(".rail-stop").forEach((s, i) => {
      s.classList.toggle("here", i === idx - 1);
      s.classList.toggle("seen", i < idx - 1);
    });
    document.getElementById("prev").disabled = idx === 0;
    document.getElementById("next").disabled = idx === slides.length - 1;

    if (window.Ambience) window.Ambience.setChapter(slide.audio);

    if (slide.scenes.length) showScene(0);
    else clearTimeout(timer);

    if (idx > 0 && hint) hint.style.opacity = "0";
  }

  // ---- controles -----------------------------------------------------------

  document.getElementById("next").addEventListener("click", () => go(idx + 1));
  document.getElementById("prev").addEventListener("click", () => go(idx - 1));

  document.getElementById("begin").addEventListener("click", () => {
    if (window.Ambience && window.Ambience.available()) {
      if (window.Ambience.start(slides[1].audio)) setSoundUI(true);
    }
    go(1);
  });

  function setSoundUI(on) {
    const b = document.getElementById("sound");
    b.setAttribute("aria-pressed", String(on));
    document.getElementById("sound-icon").innerHTML = on
      ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>'
      : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>';
  }
  document.getElementById("sound").addEventListener("click", () => {
    if (!window.Ambience || !window.Ambience.available()) return;
    setSoundUI(window.Ambience.toggle(slides[idx].audio) === true);
  });
  setSoundUI(false);

  document.getElementById("auto").addEventListener("click", (e) => {
    auto = !auto;
    e.currentTarget.setAttribute("aria-pressed", String(auto));
    document.getElementById("auto-icon").innerHTML = auto
      ? '<path d="M9 6v12M15 6v12"/>'
      : '<path d="M7 5l12 7-12 7z"/>';
    if (auto) arm(); else clearTimeout(timer);
  });

  document.getElementById("full").addEventListener("click", () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    }
  });

  // tocar na imagem troca de cena; tocar numa linha vai direto para ela
  deck.addEventListener("click", (e) => {
    const row = e.target.closest(".scene-row");
    if (row) { showScene(Number(row.dataset.scene)); return; }
    if (e.target.closest(".panel") || e.target.closest(".sheet") || e.target.closest("a") || e.target.closest("button")) return;
    if (slides[idx].scenes.length > 1) showScene(scene + 1);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(idx + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); showScene(scene + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); showScene(scene - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
  });

  let tx = 0, ty = 0, tt = 0;
  deck.addEventListener("touchstart", (e) => {
    tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; tt = Date.now();
  }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Date.now() - tt > 700) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (e.target.closest(".sheet")) return;
      go(idx + (dx < 0 ? 1 : -1));
    } else if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.4) {
      if (e.target.closest(".sheet")) return;
      if (slides[idx].scenes.length > 1) showScene(scene + (dy < 0 ? 1 : -1));
    }
  }, { passive: true });

  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => slides.forEach((s) => { if (s.scenes.length) paintCanvas(s); }), 180);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) clearTimeout(timer); else arm();
  });

  // estado inicial
  slides[0].node.classList.add("is-on");
  document.body.classList.add("is-cover");
  document.getElementById("prev").disabled = true;
  slides.forEach((s) => { if (s.scenes.length) paintCanvas(s); });
  showScene(0);
})();

</script>

</body>
</html>
