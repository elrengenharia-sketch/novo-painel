<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090E">
<title>Europa em 15 dias</title>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Europa em 15 dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Martian+Mono:wght@400;600&display=swap">

<style>
:root{
  --ink:#07090E; --ink2:#0E131C; --ink3:#161D28;
  --bone:#EDE5D6; --bone-dim:#9E9689; --bone-faint:#5E5B55;
  --brass:#C9A24B; --signal:#A8352C;
  --accent:#3F7BA8;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --data:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pad:clamp(18px,4vw,56px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);
  font-family:var(--body);font-size:16px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* ---------- deck ---------- */
.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .9s ease,visibility .9s;
  display:grid;
}
.slide.is-on{opacity:1;visibility:visible}

/* ---------- palco de imagem ---------- */
.stage{position:absolute;inset:0;overflow:hidden;background:var(--ink2)}
.stage canvas,.stage img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.stage .art{z-index:1;animation:drift 30s ease-in-out infinite alternate}
.stage .motion{z-index:2;opacity:1;transition:opacity 1.2s ease;pointer-events:none}
.stage.has-photo .motion{opacity:0}
.stage.has-photo .art{animation:none}
.stage img{
  z-index:3;opacity:0;
  animation:none;transform:scale(1.12);
  transition:opacity 1.8s ease,transform 1.8s ease;
}
.stage img.is-on{opacity:1;transform:scale(1);animation:kenburns 24s ease-out forwards}
.stage img.is-out{opacity:0;animation:none;transition:opacity 1.4s ease}
@keyframes drift{
  0%{transform:scale(1.06) translate3d(-1.2%,-0.8%,0)}
  100%{transform:scale(1.12) translate3d(1.4%,1%,0)}
}
@keyframes kenburns{
  0%{transform:scale(1) translate3d(0,0,0)}
  100%{transform:scale(1.13) translate3d(-1.6%,-1.2%,0)}
}
.scrim{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    linear-gradient(to top,rgba(7,9,14,.9) 0%,rgba(7,9,14,.42) 26%,rgba(7,9,14,0) 54%,rgba(7,9,14,.28) 100%),
    radial-gradient(105% 85% at 14% 62%,rgba(7,9,14,.82) 0%,rgba(7,9,14,0) 58%);
}
.tint{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;opacity:.32;background:var(--accent)}

/* ---------- capa ---------- */
.hero-wrap{
  position:relative;z-index:4;height:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:var(--pad);padding-block:var(--pad);gap:clamp(14px,2vh,26px);
}
.eyebrow{
  font-family:var(--data);font-size:clamp(9px,1.1vw,11px);
  letter-spacing:.28em;text-transform:uppercase;color:var(--brass);margin:0;
}
.hero-title{
  font-family:var(--display);font-variation-settings:"opsz" 144,"SOFT" 40;
  font-weight:300;font-size:clamp(52px,12vw,168px);line-height:.84;
  letter-spacing:-.03em;margin:0;text-wrap:balance;
}
.hero-title em{font-style:normal;font-weight:900;display:block}
.hero-copy{max-width:44ch;color:var(--bone-dim);font-size:clamp(14px,1.6vw,19px);margin:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,52px);margin-top:clamp(6px,1.5vh,18px)}
.hero-meta div{display:flex;flex-direction:column;gap:2px}
.hero-meta strong{font-family:var(--data);font-size:clamp(18px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-meta span{font-family:var(--data);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-faint)}
.start{
  align-self:flex-start;margin-top:clamp(10px,2vh,22px);
  display:inline-flex;align-items:center;gap:14px;
  padding:16px 30px;border-radius:999px;
  background:var(--bone);color:var(--ink);
  font-family:var(--data);font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  transition:transform .25s,box-shadow .25s;
  box-shadow:0 10px 40px -12px rgba(237,229,214,.5);
}
.start:active{transform:scale(.97)}
.start .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- capítulo ---------- */
.chapter-body{
  position:relative;z-index:4;height:100%;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--pad);padding-block:var(--pad) calc(var(--pad) + 66px);
  pointer-events:none;
}
.slide[data-side="right"] .chapter-body{align-items:flex-end;text-align:right}
.slide[data-side="right"] .scrim{
  background:
    linear-gradient(to top,rgba(7,9,14,.9) 0%,rgba(7,9,14,.42) 26%,rgba(7,9,14,0) 54%,rgba(7,9,14,.28) 100%),
    radial-gradient(105% 85% at 86% 62%,rgba(7,9,14,.82) 0%,rgba(7,9,14,0) 58%);
}
.panel{max-width:min(560px,92vw);pointer-events:auto}
.panel>*,.hero-wrap>*,.end>*{
  opacity:0;transform:translateY(22px);
  transition:opacity .85s ease,transform .85s cubic-bezier(.2,.75,.3,1);
}
.slide.is-on .panel>*,.slide.is-on .hero-wrap>*,.slide.is-on .end>*{opacity:1;transform:none}
.slide.is-on .panel>*:nth-child(1),.slide.is-on .hero-wrap>*:nth-child(1),.slide.is-on .end>*:nth-child(1){transition-delay:.18s}
.slide.is-on .panel>*:nth-child(2),.slide.is-on .hero-wrap>*:nth-child(2),.slide.is-on .end>*:nth-child(2){transition-delay:.28s}
.slide.is-on .panel>*:nth-child(3),.slide.is-on .hero-wrap>*:nth-child(3){transition-delay:.38s}
.slide.is-on .panel>*:nth-child(4),.slide.is-on .hero-wrap>*:nth-child(4){transition-delay:.48s}
.slide.is-on .panel>*:nth-child(5),.slide.is-on .hero-wrap>*:nth-child(5){transition-delay:.58s}
.slide.is-on .panel>*:nth-child(6),.slide.is-on .hero-wrap>*:nth-child(6){transition-delay:.68s}
.slide.is-on .scene-hud{animation:rise .9s .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scene-row{animation:none}
.slide.is-on .scenes li{animation:slot .7s both}
.slide.is-on .scenes li:nth-child(1){animation-delay:.52s}
.slide.is-on .scenes li:nth-child(2){animation-delay:.60s}
.slide.is-on .scenes li:nth-child(3){animation-delay:.68s}
@keyframes slot{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.slide[data-side="right"] .scenes li{animation-name:slotR}
@keyframes slotR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ch-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.slide[data-side="right"] .ch-head{justify-content:flex-end}
.ch-n{font-family:var(--data);font-size:11px;color:var(--brass);letter-spacing:.14em}
.ch-country{font-family:var(--data);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.ch-dates{
  font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:var(--brass);padding:4px 10px;border-radius:3px;
}
.ch-city{
  font-family:var(--display);font-variation-settings:"opsz" 144;
  font-weight:300;font-size:clamp(34px,6.6vw,82px);line-height:.9;
  letter-spacing:-.03em;margin:.14em 0 .1em;text-wrap:balance;
}
.ch-city em{font-style:normal;font-weight:900;font-size:.52em;display:block;color:var(--brass)}
.ch-intro{color:var(--bone-dim);font-size:clamp(12.5px,1.35vw,16px);max-width:52ch;margin:0 0 clamp(9px,1.6vh,16px)}
.slide[data-side="right"] .ch-intro{margin-left:auto}

/* lista de cenas — o texto que acompanha a imagem */
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;
  border-top:1px solid rgba(237,229,214,.14)}
.scene-row{
  display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;
  padding:8px 14px;border-bottom:1px solid rgba(237,229,214,.1);
  border-left:2px solid transparent;
  opacity:.42;transition:opacity .5s,background .5s,border-color .5s,padding .4s;
  text-align:left;width:100%;
}
.slide[data-side="right"] .scene-row{
  border-left:0;border-right:2px solid transparent;text-align:right;
  grid-template-columns:1fr auto;direction:rtl;
}
.slide[data-side="right"] .scene-row>*{direction:ltr}
.scene-row.is-live{
  opacity:1;background:rgba(237,229,214,.07);
  border-left-color:var(--accent);padding-left:20px;
}
.slide[data-side="right"] .scene-row.is-live{
  border-right-color:var(--accent);padding-left:14px;padding-right:20px;
}
.scene-time{
  font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.scene-name{font-family:var(--display);font-weight:600;font-size:clamp(15px,1.9vw,21px);
  letter-spacing:-.01em;grid-column:2;line-height:1.2}
.slide[data-side="right"] .scene-name{grid-column:1}
.scene-note{
  grid-column:2;font-size:13px;color:var(--bone-dim);line-height:1.45;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .6s ease,opacity .5s,margin .5s;
}
.slide[data-side="right"] .scene-note{grid-column:1}
.scene-row.is-live .scene-note{max-height:7.5em;opacity:1;margin-top:4px}

/* o trecho de trem que nos trouxe até aqui */
.leg{
  display:flex;flex-direction:column;gap:5px;
  margin:0 0 clamp(9px,1.5vh,15px);padding:8px 13px;
  border-left:2px solid var(--brass);
  background:linear-gradient(90deg,rgba(201,162,75,.12),rgba(201,162,75,0));
  max-width:54ch;
}
.slide[data-side="right"] .leg{
  border-left:0;border-right:2px solid var(--brass);margin-left:auto;
  background:linear-gradient(270deg,rgba(201,162,75,.12),rgba(201,162,75,0));
  align-items:flex-end;
}
.leg.is-night{
  border-color:#8E7BC4;
  background:linear-gradient(90deg,rgba(142,123,196,.18),rgba(142,123,196,0));
}
.slide[data-side="right"] .leg.is-night{background:linear-gradient(270deg,rgba(142,123,196,.18),rgba(142,123,196,0))}
.leg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slide[data-side="right"] .leg-head{justify-content:flex-end}
.leg-mode{
  font-family:var(--data);font-size:9px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);background:var(--brass);
  padding:3px 8px;border-radius:2px;white-space:nowrap;
}
.leg.is-night .leg-mode{background:#8E7BC4}
.leg-route{font-family:var(--data);font-size:12px;color:var(--bone);letter-spacing:-.01em}
.leg-time{
  font-family:var(--data);font-size:11px;color:var(--bone-dim);
  font-variant-numeric:tabular-nums;display:flex;gap:9px;align-items:baseline;
}
.leg-time i{font-style:normal;color:var(--brass);font-size:10px}
.leg.is-night .leg-time i{color:#A897D6}
/* cidades que só veremos pela janela — deliberadamente em segundo plano */
.leg-via{
  font-family:var(--data);font-size:9.5px;color:var(--bone-faint);
  line-height:1.6;letter-spacing:.02em;
}
.leg-via i{
  font-style:normal;display:block;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:#4A4843;margin-bottom:2px;
}
.sleep{
  display:flex;gap:10px;align-items:baseline;margin:clamp(7px,1.2vh,13px) 0 0;
  font-size:13px;color:var(--bone-dim);
}
.slide[data-side="right"] .sleep{justify-content:flex-end;flex-direction:row-reverse}
.sleep b{
  font-family:var(--data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass);white-space:nowrap;font-weight:400;
}

/* selo da cena + crédito */
.scene-hud{
  position:absolute;z-index:5;right:var(--pad);bottom:calc(var(--pad) + 60px);
  display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  pointer-events:auto;max-width:min(300px,44vw);
}
.slide[data-side="right"] .scene-hud{right:auto;left:var(--pad);align-items:flex-start}
.scene-hud .now{
  font-family:var(--data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);text-align:right;display:flex;align-items:center;gap:9px;
}
.slide[data-side="right"] .scene-hud .now{text-align:left;flex-direction:row-reverse}
.scene-hud .now i{
  font-style:normal;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);
  flex:none;
}
.ticks{display:flex;gap:5px}
.ticks i{display:block;width:26px;height:2px;background:rgba(237,229,214,.22);border-radius:2px;overflow:hidden}
.ticks i.done{background:rgba(237,229,214,.5)}
.ticks i.live{background:rgba(237,229,214,.22)}
.ticks i.live::after{
  content:"";display:block;height:100%;width:0;background:var(--accent);
  animation:fill var(--dur,7s) linear forwards;
}
@keyframes fill{to{width:100%}}
.credit{
  font-family:var(--data);font-size:9px;letter-spacing:.06em;
  color:var(--bone-faint);text-decoration:none;text-align:right;line-height:1.5;
}
.slide[data-side="right"] .credit{text-align:left}
.credit:hover,.credit:focus{color:var(--bone-dim);text-decoration:underline}
.credit.generated{color:#4C4A46}

/* ---------- calendário ---------- */
.sheet{
  position:relative;z-index:4;height:100%;overflow-y:auto;
  padding:var(--pad);padding-block:calc(var(--pad) + 34px);
  background:
    radial-gradient(90% 60% at 50% 0%,rgba(63,123,168,.16) 0%,rgba(7,9,14,0) 70%),
    var(--ink);
  -webkit-overflow-scrolling:touch;
}
.sheet h2{
  font-family:var(--display);font-weight:300;font-size:clamp(32px,6vw,68px);
  line-height:.92;letter-spacing:-.03em;margin:.2em 0 .5em;text-wrap:balance;
}
.sheet h2 em{font-style:normal;font-weight:900}
.cal{display:grid;gap:1px;background:rgba(237,229,214,.12);border:1px solid rgba(237,229,214,.12)}
.cal-row{
  display:grid;grid-template-columns:78px 1fr 148px;gap:0;
  background:var(--ink);align-items:stretch;
}
.cal-row.is-night{background:linear-gradient(90deg,rgba(142,123,196,.11),rgba(7,9,14,0) 60%)}
.cal-day{
  font-family:var(--data);font-weight:600;font-size:clamp(16px,2.4vw,24px);
  font-variant-numeric:tabular-nums;color:var(--brass);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:14px 8px;border-right:1px solid rgba(237,229,214,.12);gap:3px;
}
.cal-row.is-night .cal-day{color:#A897D6}
.cal-day small{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-faint)}
.cal-main{padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-place{font-family:var(--display);font-weight:600;font-size:clamp(15px,2vw,20px)}
.cal-detail{font-size:13px;color:var(--bone-dim)}
/* rota de passagem: recuada de propósito, não conta como cidade visitada */
.cal-route{
  font-family:var(--data);font-size:9.5px;letter-spacing:.06em;
  color:var(--bone-faint);margin-top:4px;line-height:1.5;
}
.cal-route i{
  font-style:normal;font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:#4A4843;display:block;margin-bottom:1px;
}
.cal-sleep{
  padding:14px 16px;border-left:1px solid rgba(237,229,214,.12);
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  font-family:var(--data);font-size:10.5px;color:var(--bone-dim);
}
.cal-sleep i{
  font-style:normal;font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-faint);
}
.cal-row.is-night .cal-sleep{color:#BDB0E2}

.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 13px 7px 9px;border:1px solid rgba(237,229,214,.18);border-radius:999px;
  font-size:13px;color:var(--bone-dim);
}
.flag-chip i{
  font-style:normal;font-family:var(--data);font-size:9px;font-weight:600;
  letter-spacing:.1em;color:var(--ink);background:var(--brass);
  padding:2px 5px;border-radius:2px;
}

.log-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px;margin-top:36px}
.log-item{border-top:2px solid var(--brass);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.log-item h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.log-item p{margin:0;font-size:13.5px;color:var(--bone-dim)}

/* ---------- fecho ---------- */
.end{
  position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:18px;
  padding:var(--pad);padding-block:var(--pad);
}
.end p{
  font-family:var(--display);font-weight:300;font-style:italic;
  font-size:clamp(24px,5vw,56px);line-height:1.15;letter-spacing:-.02em;
  max-width:20ch;margin:0;text-wrap:balance;
}
.end span{font-family:var(--data);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}

/* ---------- trilho de navegação ---------- */
.rail{
  position:fixed;z-index:20;left:0;right:0;top:0;
  display:flex;align-items:center;gap:2px;
  padding:10px var(--pad);
  background:linear-gradient(to bottom,rgba(7,9,14,.85),rgba(7,9,14,0));
  pointer-events:auto;
}
.rail-stop{
  flex:1;height:26px;display:flex;align-items:center;justify-content:center;
  position:relative;min-width:0;
}
.rail-stop::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  background:rgba(237,229,214,.16);transform:translateY(-50%);
}
.rail-stop.seen::before{background:rgba(237,229,214,.45)}
.rail-stop.here::before{background:var(--accent)}
.rail-stop b{
  position:relative;z-index:1;font-family:var(--data);font-size:7.5px;
  letter-spacing:.02em;color:var(--bone-faint);background:var(--ink);
  padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .3s;
}
.rail-stop.here b{color:var(--bone);font-weight:600}
.rail-stop.seen b{color:var(--bone-dim)}

/* ---------- controles ---------- */
.hud{
  position:fixed;z-index:22;left:var(--pad);bottom:var(--pad);
  display:flex;gap:8px;align-items:center;
}
.slide-hero ~ .hud{}
.hud button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(237,229,214,.22);
  display:grid;place-items:center;
  background:rgba(7,9,14,.55);backdrop-filter:blur(8px);
  transition:border-color .3s,background .3s;
}
.hud button:active{background:rgba(237,229,214,.14)}
.hud button[aria-pressed="true"]{border-color:var(--brass)}
.hud svg{width:17px;height:17px;fill:none;stroke:var(--bone);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.hud button[aria-pressed="true"] svg{stroke:var(--brass)}

.arrows{position:fixed;z-index:21;right:var(--pad);bottom:var(--pad);display:flex;gap:8px}
.arrows button{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(237,229,214,.22);display:grid;place-items:center;
  background:rgba(7,9,14,.55);backdrop-filter:blur(8px);
}
.arrows button:disabled{opacity:.3}
.arrows svg{width:18px;height:18px;fill:none;stroke:var(--bone);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.hint{
  position:fixed;z-index:21;left:50%;bottom:calc(var(--pad) + 6px);transform:translateX(-50%);
  font-family:var(--data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bone-faint);pointer-events:none;transition:opacity .6s;white-space:nowrap;
}

.is-cover .rail,.is-cover .arrows,.is-cover .hint{opacity:0;pointer-events:none}
.rail,.arrows,.hint,.hud{transition:opacity .6s}

@media (max-width:760px){
  .scene-hud{
    left:var(--pad);right:var(--pad);bottom:auto;top:calc(var(--pad) + 26px);
    align-items:flex-start;max-width:none;
  }
  .slide[data-side="right"] .scene-hud{left:var(--pad);right:var(--pad)}
  .slide[data-side="right"] .chapter-body{align-items:flex-start;text-align:left}
  .slide[data-side="right"] .scene-row{
    border-right:0;border-left:2px solid transparent;text-align:left;
    grid-template-columns:auto 1fr;direction:ltr;
  }
  .slide[data-side="right"] .scene-row.is-live{border-left-color:var(--accent);padding-left:20px;padding-right:14px}
  .slide[data-side="right"] .scene-name,.slide[data-side="right"] .scene-note{grid-column:2}
  .slide[data-side="right"] .ch-head{justify-content:flex-start}
  .slide[data-side="right"] .ch-intro,.slide[data-side="right"] .transit{margin-left:0}
  .slide[data-side="right"] .transit{flex-direction:row;text-align:left}
  .chapter-body{padding-bottom:calc(var(--pad) + 56px)}
  .scene-note{display:none}
  .hint{display:none}
  .cal-row{grid-template-columns:56px 1fr}
  .cal-sleep{
    grid-column:2;border-left:0;border-top:1px solid rgba(237,229,214,.1);
    flex-direction:row;align-items:baseline;gap:8px;padding:8px 18px 12px;
  }
  .leg{max-width:none}
  .leg-via{font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .stage img{transform:none!important}
}

/* ===== photos-live.js ===== */
// Resolve as fotografias consultando a API do Wikimedia Commons no momento da exibição.
// Assim os endereços e os créditos vêm da fonte, em vez de dependerem de nomes fixos.
// Onde a rede ou a política da página bloqueia a consulta, nada acontece:
// a cena desenhada em Canvas permanece no lugar.
(function () {
  "use strict";

  const API = "https://commons.wikimedia.org/w/api.php";

  const TERMS = {
    paris: ["Île de la Cité Paris Seine", "Louvre Palace courtyard Paris", "Eiffel Tower from Trocadéro"],
    brussels: ["Grand-Place Brussels guildhalls", "Galeries Royales Saint-Hubert Brussels", "Mont des Arts Brussels view"],
    amsterdam: ["Jordaan canal Amsterdam houses", "Amsterdam canal cruise boat", "Museumplein Rijksmuseum Amsterdam"],
    cologne: ["Cologne Cathedral exterior Rhine", "Cologne Altstadt old town houses", "Hohenzollern Bridge Cologne night"],
    luxembourg: ["Chemin de la Corniche Luxembourg City", "Bock Casemates Luxembourg", "Grund Luxembourg City Alzette"],
    strasbourg: ["Strasbourg Cathedral facade", "Petite France Strasbourg canal", "Barrage Vauban Strasbourg"],
    lucerne: ["Kapellbrücke Chapel Bridge Lucerne", "Mount Titlis snow Switzerland", "Lake Lucerne Alps panorama"],
    milan: ["Milan Cathedral Duomo facade", "Galleria Vittorio Emanuele II Milan interior", "Navigli canal Milan evening"],
    venice: ["Rialto Bridge Grand Canal Venice", "Piazza San Marco Venice campanile", "Venice narrow canal gondola"],
    vienna: ["St Stephen's Cathedral Vienna", "Schönbrunn Palace Vienna garden", "Belvedere Palace Vienna"],
    budapest: ["Fisherman's Bastion Buda Castle Budapest", "Hungarian Parliament Building Danube Budapest", "Széchenyi Thermal Bath Budapest"],
    bratislava: ["Bratislava old town Michael's Gate", "Bratislava Castle Danube", "SNP Bridge Danube Bratislava"],
    krakow: ["Main Market Square Kraków Cloth Hall", "Wawel Castle Kraków Vistula", "Wieliczka Salt Mine Saint Kinga Chapel"],
    prague: ["Charles Bridge Prague", "Prague Castle Malá Strana panorama", "Prague Astronomical Clock Old Town Square"]
  };

  const REJECT = /(map|mapa|plan|diagram|logo|coat of arms|flag|seal|icon|chart|graph|drawing|engraving|\.svg|\.png)/i;

  const strip = (html) => {
    const d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  };

  let blocked = false;

  async function search(term) {
    if (blocked) return null;
    const url = API + "?" + new URLSearchParams({
      action: "query", format: "json", origin: "*",
      generator: "search", gsrsearch: term + " filetype:bitmap",
      gsrnamespace: "6", gsrlimit: "8",
      prop: "imageinfo", iiprop: "url|size|extmetadata", iiurlwidth: "1600"
    });
    let data;
    try {
      const res = await fetch(url, { mode: "cors" });
      if (!res.ok) return null;
      data = await res.json();
    } catch (e) {
      blocked = true; // CSP ou rede indisponível — desiste de vez
      return null;
    }
    const pages = data && data.query && data.query.pages;
    if (!pages) return null;

    const list = Object.values(pages)
      .filter((p) => p.imageinfo && p.imageinfo[0])
      .map((p) => ({ title: p.title, i: p.imageinfo[0], idx: p.index || 99 }))
      .filter((p) => !REJECT.test(p.title))
      .filter((p) => p.i.width && p.i.height && p.i.width >= p.i.height * 1.15)
      .sort((a, b) => a.idx - b.idx);

    const hit = list[0];
    if (!hit) return null;
    const meta = hit.i.extmetadata || {};
    return {
      src: hit.i.thumburl || hit.i.url,
      by: strip(meta.Artist && meta.Artist.value) || "Wikimedia Commons",
      lic: strip(meta.LicenseShortName && meta.LicenseShortName.value) || "CC",
      href: hit.i.descriptionurl || "https://commons.wikimedia.org/"
    };
  }

  const done = {};

  async function resolveChapter(ch, onScene) {
    if (blocked || done[ch.id]) return;
    done[ch.id] = true;
    const terms = TERMS[ch.id] || [];
    for (let i = 0; i < ch.scenes.length; i++) {
      const term = terms[i];
      if (!term) continue;
      const found = await search(term);
      if (!found) continue;
      const sc = ch.scenes[i];
      sc.photo = found.src;
      sc.credit = found;
      if (onScene) onScene(ch, i, sc);
      if (blocked) return;
    }
  }

  window.LivePhotos = {
    get blocked() { return blocked; },
    resolveChapter: resolveChapter
  };
})();

/* ===== landmarks.js ===== */
// Monumentos desenhados com a proporção real de cada um.
// Assinatura igual à dos arquétipos: (ctx, x, base, w, h, p, r) — cor já definida.
// A cor é usada como silhueta; recortes usam destination-out para abrir vãos.
(function () {
  "use strict";

  const cut = (ctx, fn) => {
    ctx.globalCompositeOperation = "destination-out";
    fn();
    ctx.globalCompositeOperation = "source-over";
  };

  // traça um perfil simétrico a partir de meia-largura em função da altura
  function profile(ctx, cx, base, H, halfAt, steps) {
    const n = steps || 44;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = i / n, y = base - H * t, hw = halfAt(t);
      i === 0 ? ctx.moveTo(cx - hw, y) : ctx.lineTo(cx - hw, y);
    }
    for (let i = n; i >= 0; i--) {
      const t = i / n, y = base - H * t, hw = halfAt(t);
      ctx.lineTo(cx + hw, y);
    }
    ctx.closePath();
  }

  // agulha gótica: corpo que afina e termina em ponta, com pináculos
  function spire(ctx, cx, base, wBase, H, openwork) {
    const body = H * 0.58, tip = H * 0.42;
    ctx.beginPath();
    ctx.moveTo(cx - wBase / 2, base);
    ctx.lineTo(cx - wBase * 0.34, base - body);
    ctx.lineTo(cx, base - body - tip);
    ctx.lineTo(cx + wBase * 0.34, base - body);
    ctx.lineTo(cx + wBase / 2, base);
    ctx.closePath(); ctx.fill();
    if (openwork) {
      cut(ctx, () => {
        for (let i = 1; i <= 5; i++) {
          const t = i / 6.5, y = base - body * t;
          const hw = wBase * (0.5 - t * 0.16) * 0.52;
          ctx.beginPath();
          ctx.arc(cx, y - hw * 0.5, hw, Math.PI, 0);
          ctx.rect(cx - hw, y - hw * 0.5, hw * 2, body * 0.1);
          ctx.fill();
        }
        // vão na agulha
        for (let i = 1; i <= 3; i++) {
          const t = i / 4.4;
          const yy = base - body - tip * t;
          const hw = wBase * 0.2 * (1 - t);
          ctx.beginPath(); ctx.moveTo(cx - hw, yy);
          ctx.lineTo(cx, yy - tip * 0.13); ctx.lineTo(cx + hw, yy);
          ctx.closePath(); ctx.fill();
        }
      });
    }
  }

  function rose(ctx, cx, cy, rad) {
    cut(ctx, () => {
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.3); ctx.fill();
    });
    ctx.beginPath(); ctx.arc(cx, cy, rad * 0.2, 0, 6.3); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * 6.283;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
      ctx.lineTo(cx + Math.cos(a + 0.16) * rad, cy + Math.sin(a + 0.16) * rad);
      ctx.closePath(); ctx.fill();
    }
  }

  function windows(ctx, x, base, w, h, cols, arch) {
    cut(ctx, () => {
      for (let i = 0; i < cols; i++) {
        const wx = x + w * ((i + 0.5) / cols), ww = (w / cols) * 0.3;
        if (arch) {
          ctx.beginPath();
          ctx.arc(wx, base - h * 0.55, ww, Math.PI, 0);
          ctx.rect(wx - ww, base - h * 0.55, ww * 2, h * 0.34);
          ctx.fill();
        } else {
          ctx.fillRect(wx - ww, base - h * 0.62, ww * 2, h * 0.3);
        }
      }
    });
  }

  const L = {};

  // ---- Paris ---------------------------------------------------------------

  // Torre Eiffel: 330 m de altura, 125 m de base. Perfil exponencial,
  // plataformas a 57, 115 e 276 m, e o arco entre os pés.
  L.eiffel = function (ctx, x, base, w, h, p, r) {
    const H = h * 1.15, cx = x + w / 2;
    const halfAt = (t) => H * (0.0085 + 0.175 * Math.exp(-4.0 * t));

    profile(ctx, cx, base, H, halfAt); ctx.fill();
    // vaza o interior, deixando os pés como bandas
    cut(ctx, () => { profile(ctx, cx, base, H, (t) => Math.max(0, halfAt(t) - H * 0.016)); ctx.fill(); });

    // plataformas
    [[0.173, 1.45, 0.02], [0.348, 1.5, 0.016], [0.837, 2.4, 0.012]].forEach(([t, ext, th]) => {
      const hw = halfAt(t) * ext;
      ctx.fillRect(cx - hw, base - H * t - H * th, hw * 2, H * th * 1.6);
    });

    // mastro central acima da 2ª plataforma + antena
    ctx.fillRect(cx - H * 0.0075, base - H * 0.86, H * 0.015, H * 0.52);
    ctx.fillRect(cx - H * 0.004, base - H, H * 0.008, H * 0.145);

    // treliça: barras horizontais e diagonais
    ctx.lineWidth = Math.max(1, H * 0.0045);
    ctx.strokeStyle = ctx.fillStyle;
    for (let i = 1; i < 16; i++) {
      const t = 0.02 + (i / 16) * 0.8, hw = halfAt(t);
      ctx.beginPath();
      ctx.moveTo(cx - hw, base - H * t); ctx.lineTo(cx + hw, base - H * t); ctx.stroke();
      if (t < 0.34) {
        const t2 = t + 0.05, hw2 = halfAt(t2);
        ctx.beginPath();
        ctx.moveTo(cx - hw, base - H * t); ctx.lineTo(cx - hw2 * 0.2, base - H * t2);
        ctx.moveTo(cx + hw, base - H * t); ctx.lineTo(cx + hw2 * 0.2, base - H * t2);
        ctx.stroke();
      }
    }

    // o arco da base
    cut(ctx, () => {
      const ah = H * 0.135, aw = halfAt(0) * 0.98;
      ctx.beginPath();
      ctx.moveTo(cx - aw, base);
      ctx.quadraticCurveTo(cx - aw * 0.55, base - ah, cx, base - ah * 0.92);
      ctx.quadraticCurveTo(cx + aw * 0.55, base - ah, cx + aw, base);
      ctx.closePath(); ctx.fill();
    });
  };

  // Notre-Dame: duas torres quadradas de 69 m, nave, flecha e rosácea
  L.notredame = function (ctx, x, base, w, h, p, r) {
    const nave = h * 0.52, tw = w * 0.2, th = h * 0.82;
    ctx.fillRect(x + w * 0.16, base - nave, w * 0.68, nave);
    [x + w * 0.16, x + w * 0.64].forEach((tx) => {
      ctx.fillRect(tx, base - th, tw, th);
      cut(ctx, () => {
        const ww = tw * 0.16;
        [0.3, 0.62].forEach((o) => {
          const wx = tx + tw * o + ww;
          ctx.beginPath();
          ctx.arc(wx, base - th * 0.86, ww, Math.PI, 0);
          ctx.rect(wx - ww, base - th * 0.86, ww * 2, th * 0.2);
          ctx.fill();
        });
      });
    });
    // flecha
    const sx = x + w * 0.5;
    ctx.beginPath();
    ctx.moveTo(sx - w * 0.035, base - nave);
    ctx.lineTo(sx, base - h * 1.02); ctx.lineTo(sx + w * 0.035, base - nave);
    ctx.closePath(); ctx.fill();
    // arcobotantes
    ctx.lineWidth = Math.max(1, w * 0.008); ctx.strokeStyle = ctx.fillStyle;
    for (let i = 0; i < 4; i++) {
      const bx = x + w * (0.2 + i * 0.17);
      ctx.beginPath();
      ctx.moveTo(bx, base);
      ctx.quadraticCurveTo(bx + w * 0.05, base - nave * 0.6, bx + w * 0.1, base - nave * 0.95);
      ctx.stroke();
    }
    rose(ctx, x + w * 0.5, base - nave * 0.62, w * 0.075);
  };

  // Louvre: a pirâmide de vidro diante das alas do palácio
  L.louvre = function (ctx, x, base, w, h, p, r) {
    const pal = h * 0.46;
    ctx.fillRect(x, base - pal, w, pal);
    // pavilhão central com frontão
    ctx.fillRect(x + w * 0.38, base - pal - h * 0.1, w * 0.24, h * 0.1);
    windows(ctx, x, base, w, pal, 16, true);
    // pirâmide: 35 m de base, 21,6 m de altura
    const px = x + w * 0.5, pw = w * 0.3, ph = pw * 0.617;
    ctx.beginPath();
    ctx.moveTo(px - pw / 2, base); ctx.lineTo(px, base - ph); ctx.lineTo(px + pw / 2, base);
    ctx.closePath(); ctx.fill();
    cut(ctx, () => {
      ctx.lineWidth = Math.max(1, w * 0.004);
      ctx.strokeStyle = "#000";
      for (let i = 1; i < 7; i++) {
        const t = i / 7;
        ctx.beginPath();
        ctx.moveTo(px - (pw / 2) * (1 - t), base - ph * t);
        ctx.lineTo(px + (pw / 2) * (1 - t), base - ph * t); ctx.stroke();
      }
      for (let i = 1; i < 5; i++) {
        const o = (i / 5 - 0.5) * pw;
        ctx.beginPath(); ctx.moveTo(px + o, base); ctx.lineTo(px, base - ph); ctx.stroke();
      }
    });
  };

  // ---- Bruxelas ------------------------------------------------------------

  // Grand-Place: torre da prefeitura fora do eixo + empenas das guildas
  L.grandplace = function (ctx, x, base, w, h, p, r) {
    const n = 7;
    for (let i = 0; i < n; i++) {
      const bw = w / n, bx = x + i * bw, bh = h * (0.44 + (i % 3) * 0.06);
      ctx.fillRect(bx + bw * 0.05, base - bh, bw * 0.9, bh);
      // empena em degraus com volutas
      let sy = base - bh;
      for (let s = 0; s < 4; s++) {
        const ins = bw * (0.08 + s * 0.1);
        ctx.fillRect(bx + ins, sy - bw * 0.1, bw - ins * 2, bw * 0.11);
        sy -= bw * 0.1;
      }
      ctx.beginPath(); ctx.arc(bx + bw * 0.5, sy, bw * 0.05, 0, 6.3); ctx.fill();
      windows(ctx, bx, base, bw, bh, 2, true);
    }
    // torre da prefeitura, 96 m, deslocada do centro
    const tx = x + w * 0.3, tw = w * 0.09;
    ctx.fillRect(tx, base - h * 0.72, tw, h * 0.72);
    spire(ctx, tx + tw / 2, base - h * 0.72, tw * 1.5, h * 0.42, true);
    windows(ctx, tx, base - h * 0.3, tw, h * 0.4, 1, true);
  };

  // ---- Colônia -------------------------------------------------------------

  // Dom: duas agulhas vazadas de 157 m, altíssimas e estreitas
  L.koelnerdom = function (ctx, x, base, w, h, p, r) {
    const nave = h * 0.4;
    ctx.fillRect(x + w * 0.2, base - nave, w * 0.6, nave);
    // transepto com telhado alto
    ctx.beginPath();
    ctx.moveTo(x + w * 0.2, base - nave);
    ctx.lineTo(x + w * 0.5, base - nave - h * 0.12);
    ctx.lineTo(x + w * 0.8, base - nave);
    ctx.closePath(); ctx.fill();
    windows(ctx, x + w * 0.2, base, w * 0.6, nave, 7, true);
    // as duas agulhas
    [0.26, 0.74].forEach((o) => {
      const cx = x + w * o, tw = w * 0.14;
      ctx.fillRect(cx - tw / 2, base - h * 0.58, tw, h * 0.58);
      windows(ctx, cx - tw / 2, base - h * 0.16, tw, h * 0.42, 2, true);
      spire(ctx, cx, base - h * 0.58, tw, h * 0.46, true);
    });
  };

  // ---- Strasbourg ----------------------------------------------------------

  // Notre-Dame de Strasbourg: assimétrica, uma só agulha a 142 m
  L.strasbourgcath = function (ctx, x, base, w, h, p, r) {
    const nave = h * 0.46;
    ctx.fillRect(x + w * 0.24, base - nave, w * 0.52, nave);
    const bx = x + w * 0.24, bw = w * 0.52;
    ctx.fillRect(bx, base - h * 0.6, bw, h * 0.6 - 0);
    windows(ctx, bx, base, bw, h * 0.6, 5, true);
    rose(ctx, bx + bw * 0.5, base - h * 0.4, w * 0.08);
    // torre norte, única, com a agulha
    const tx = bx + bw * 0.22, tw = bw * 0.34;
    ctx.fillRect(tx, base - h * 0.78, tw, h * 0.78);
    windows(ctx, tx, base - h * 0.42, tw, h * 0.36, 2, true);
    spire(ctx, tx + tw / 2, base - h * 0.78, tw * 0.9, h * 0.4, true);
    // plataforma no lado sul, inacabado
    ctx.fillRect(bx + bw * 0.66, base - h * 0.66, bw * 0.3, h * 0.66);
  };

  // ---- Lucerna -------------------------------------------------------------

  // Kapellbrücke: ponte coberta de madeira na diagonal + Wasserturm octogonal
  L.kapellbruecke = function (ctx, x, base, w, h, p, r) {
    const deck = base - h * 0.2;
    // tabuleiro levemente inclinado
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x, deck + h * 0.04);
    ctx.lineTo(x + w, deck - h * 0.04);
    ctx.lineTo(x + w, deck + h * 0.1); ctx.lineTo(x, deck + h * 0.18);
    ctx.closePath(); ctx.fill();
    // telhado de duas águas correndo sobre a ponte
    ctx.beginPath();
    ctx.moveTo(x, deck + h * 0.04);
    ctx.lineTo(x, deck - h * 0.1);
    ctx.lineTo(x + w, deck - h * 0.18);
    ctx.lineTo(x + w, deck - h * 0.04);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // estacas na água
    for (let i = 0; i < 9; i++) {
      const px = x + w * (0.05 + i * 0.107);
      const dy = deck + h * 0.16 - (i / 9) * h * 0.08;
      ctx.fillRect(px, dy, w * 0.012, h * 0.22);
    }
    // Wasserturm: torre octogonal de pedra
    const tx = x + w * 0.66, tw = w * 0.1;
    ctx.fillRect(tx, base - h * 0.74, tw, h * 0.74);
    ctx.beginPath();
    ctx.moveTo(tx - tw * 0.16, base - h * 0.74);
    ctx.lineTo(tx + tw * 0.5, base - h * 0.94);
    ctx.lineTo(tx + tw * 1.16, base - h * 0.74);
    ctx.closePath(); ctx.fill();
    windows(ctx, tx, base - h * 0.3, tw, h * 0.44, 1, true);
  };

  // Titlis: pico nevado, teleférico e a ponte suspensa
  L.titlis = function (ctx, x, base, w, h, p, r) {
    const peaks = [[0.0, 0.34], [0.18, 0.72], [0.36, 0.52], [0.56, 0.96], [0.78, 0.6], [1, 0.4]];
    ctx.beginPath(); ctx.moveTo(x, base);
    peaks.forEach(([px, py]) => ctx.lineTo(x + w * px, base - h * py));
    ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
    // neve nas cristas
    ctx.save(); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    peaks.forEach(([px, py]) => {
      if (py < 0.5) return;
      ctx.beginPath();
      ctx.moveTo(x + w * px - w * 0.07, base - h * (py - 0.18));
      ctx.lineTo(x + w * px, base - h * py);
      ctx.lineTo(x + w * px + w * 0.07, base - h * (py - 0.18));
      ctx.lineTo(x + w * px + w * 0.02, base - h * (py - 0.12));
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();
    // cabo do teleférico com uma cabine
    ctx.lineWidth = Math.max(1, w * 0.003); ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.04, base - h * 0.5);
    ctx.quadraticCurveTo(x + w * 0.3, base - h * 0.72, x + w * 0.56, base - h * 0.92);
    ctx.stroke();
    ctx.fillRect(x + w * 0.27, base - h * 0.66, w * 0.035, h * 0.05);
    // ponte suspensa entre dois pontos altos
    ctx.beginPath();
    ctx.moveTo(x + w * 0.56, base - h * 0.9);
    ctx.quadraticCurveTo(x + w * 0.67, base - h * 0.82, x + w * 0.78, base - h * 0.58);
    ctx.stroke();
  };

  // ---- Itália --------------------------------------------------------------

  // Duomo de Milão: fachada larga e floresta de pináculos, Madonnina ao centro
  L.duomomilano = function (ctx, x, base, w, h, p, r) {
    const body = h * 0.5;
    ctx.fillRect(x + w * 0.06, base - body, w * 0.88, body);
    // frontão triangular escalonado
    ctx.beginPath();
    ctx.moveTo(x + w * 0.06, base - body);
    ctx.lineTo(x + w * 0.5, base - body - h * 0.2);
    ctx.lineTo(x + w * 0.94, base - body);
    ctx.closePath(); ctx.fill();
    // floresta de pináculos
    const n = 17;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const px = x + w * (0.08 + t * 0.84);
      const d = Math.abs(t - 0.5);
      const ph = h * (0.5 - d * 0.62) * (0.62 + (i % 2) * 0.2);
      const pw = w * 0.017;
      const py = base - body - h * 0.2 * (1 - d * 1.9);
      ctx.fillRect(px - pw / 2, py, pw, ph * 0.4);
      ctx.beginPath();
      ctx.moveTo(px - pw, py); ctx.lineTo(px, py - ph * 0.44); ctx.lineTo(px + pw, py);
      ctx.closePath(); ctx.fill();
    }
    // Madonnina no ponto mais alto
    ctx.beginPath(); ctx.arc(x + w * 0.5, base - body - h * 0.44, w * 0.013, 0, 6.3); ctx.fill();
    windows(ctx, x + w * 0.06, base, w * 0.88, body, 9, true);
  };

  // Galleria Vittorio Emanuele: abóbada de ferro e vidro com cúpula central
  L.galleria = function (ctx, x, base, w, h, p, r) {
    const cx = x + w / 2, span = w * 0.72, top = base - h * 0.72;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(cx - span / 2, base - h * 0.5, span, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(cx - span / 2, base - h * 0.5);
    ctx.arc(cx, base - h * 0.5, span / 2, Math.PI, 0);
    ctx.closePath(); ctx.fill();
    // cúpula
    ctx.beginPath(); ctx.arc(cx, top + h * 0.1, span * 0.24, Math.PI, 0); ctx.fill();
    ctx.globalAlpha = 1;
    // nervuras de ferro
    cut(ctx, () => {
      ctx.lineWidth = Math.max(1, w * 0.0055); ctx.strokeStyle = "#000";
      for (let i = 1; i < 12; i++) {
        const a = Math.PI + (i / 12) * Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx, base - h * 0.5);
        ctx.lineTo(cx + Math.cos(a) * span * 0.5, base - h * 0.5 + Math.sin(a) * span * 0.5);
        ctx.stroke();
      }
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, base - h * 0.5, span * 0.5 * (i / 4), Math.PI, 0); ctx.stroke();
      }
    });
  };

  // Veneza: campanile de San Marco, cúpula da Salute e uma gôndola
  L.venice = function (ctx, x, base, w, h, p, r) {
    // Salute, à direita
    const dx = x + w * 0.76, dr = w * 0.1;
    ctx.fillRect(dx - dr, base - h * 0.3, dr * 2, h * 0.3);
    ctx.beginPath(); ctx.arc(dx, base - h * 0.3, dr, Math.PI, 0); ctx.fill();
    ctx.fillRect(dx - dr * 0.1, base - h * 0.3 - dr - h * 0.07, dr * 0.2, h * 0.07);
    // Palácio Ducal, arcadas baixas
    ctx.fillRect(x + w * 0.28, base - h * 0.26, w * 0.34, h * 0.26);
    windows(ctx, x + w * 0.28, base, w * 0.34, h * 0.26, 9, true);
    // campanile: 98 m, fuste quadrado, cela, pirâmide
    const cx = x + w * 0.18, cw = w * 0.075;
    ctx.fillRect(cx - cw / 2, base - h * 0.88, cw, h * 0.88);
    ctx.fillRect(cx - cw * 0.62, base - h * 0.88, cw * 1.24, h * 0.1);
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.56, base - h * 0.98);
    ctx.lineTo(cx, base - h * 1.14); ctx.lineTo(cx + cw * 0.56, base - h * 0.98);
    ctx.closePath(); ctx.fill();
    cut(ctx, () => {
      const ww = cw * 0.18;
      ctx.beginPath();
      ctx.arc(cx, base - h * 0.8, ww, Math.PI, 0);
      ctx.rect(cx - ww, base - h * 0.8, ww * 2, h * 0.06); ctx.fill();
    });
    // gôndola
    const gx = x + w * 0.5, gy = base + h * 0.1;
    ctx.beginPath();
    ctx.moveTo(gx - w * 0.075, gy);
    ctx.quadraticCurveTo(gx, gy + h * 0.045, gx + w * 0.075, gy);
    ctx.quadraticCurveTo(gx + w * 0.05, gy - h * 0.012, gx - w * 0.075, gy);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(gx - w * 0.085, gy - h * 0.055, w * 0.007, h * 0.055);
    ctx.fillRect(gx + w * 0.03, gy - h * 0.07, w * 0.005, h * 0.07);
  };

  // ---- Viena ---------------------------------------------------------------

  // Stephansdom: agulha sul de 136 m, torre norte baixa e telhado em ziguezague
  L.stephansdom = function (ctx, x, base, w, h, p, r) {
    const nave = h * 0.34;
    ctx.fillRect(x + w * 0.2, base - nave, w * 0.62, nave);
    // telhado muito inclinado
    ctx.beginPath();
    ctx.moveTo(x + w * 0.2, base - nave);
    ctx.lineTo(x + w * 0.48, base - nave - h * 0.26);
    ctx.lineTo(x + w * 0.82, base - nave - h * 0.16);
    ctx.lineTo(x + w * 0.82, base - nave);
    ctx.closePath(); ctx.fill();
    // padrão de telhas em losango
    cut(ctx, () => {
      for (let i = 0; i < 7; i++) {
        for (let j = 0; j < 3; j++) {
          const zx = x + w * (0.26 + i * 0.077), zy = base - nave - h * (0.05 + j * 0.06);
          ctx.beginPath();
          ctx.moveTo(zx, zy - h * 0.016); ctx.lineTo(zx + w * 0.016, zy);
          ctx.lineTo(zx, zy + h * 0.016); ctx.lineTo(zx - w * 0.016, zy);
          ctx.closePath(); ctx.fill();
        }
      }
    });
    // torre sul, alta
    const sx = x + w * 0.26, sw = w * 0.1;
    ctx.fillRect(sx - sw / 2, base - h * 0.6, sw, h * 0.6);
    windows(ctx, sx - sw / 2, base - h * 0.22, sw, h * 0.38, 1, true);
    spire(ctx, sx, base - h * 0.6, sw, h * 0.48, true);
    // torre norte, inacabada, com cúpula
    const nx = x + w * 0.78, nw = w * 0.085;
    ctx.fillRect(nx - nw / 2, base - h * 0.46, nw, h * 0.46);
    ctx.beginPath(); ctx.arc(nx, base - h * 0.46, nw * 0.58, Math.PI, 0); ctx.fill();
    ctx.fillRect(nx - nw * 0.05, base - h * 0.52 - nw * 0.5, nw * 0.1, nw * 0.5);
  };

  // Schönbrunn: palácio barroco longo, corpo central destacado, jardim
  L.schoenbrunn = function (ctx, x, base, w, h, p, r) {
    const body = h * 0.4;
    ctx.fillRect(x + w * 0.02, base - body, w * 0.96, body);
    ctx.fillRect(x + w * 0.36, base - body - h * 0.12, w * 0.28, h * 0.12);
    // frontão e lanternim
    ctx.beginPath();
    ctx.moveTo(x + w * 0.4, base - body - h * 0.12);
    ctx.lineTo(x + w * 0.5, base - body - h * 0.2);
    ctx.lineTo(x + w * 0.6, base - body - h * 0.12);
    ctx.closePath(); ctx.fill();
    windows(ctx, x + w * 0.02, base, w * 0.96, body, 22, true);
    // parterre em canteiros
    for (let i = 0; i < 12; i++) {
      const gx = x + w * (0.06 + i * 0.078);
      ctx.beginPath();
      ctx.ellipse(gx, base + h * 0.05, w * 0.022, h * 0.03, 0, 0, 6.3); ctx.fill();
    }
  };

  // ---- Budapeste -----------------------------------------------------------

  // Parlamento: cúpula central de 96 m e alas simétricas na margem do Danúbio
  L.parliament = function (ctx, x, base, w, h, p, r) {
    const body = h * 0.34, cx = x + w / 2;
    ctx.fillRect(x, base - body, w, body);
    windows(ctx, x, base, w, body, 26, true);
    // cúpula central
    const dr = w * 0.085;
    ctx.fillRect(cx - dr * 1.1, base - body - h * 0.1, dr * 2.2, h * 0.1);
    ctx.beginPath(); ctx.arc(cx, base - body - h * 0.1, dr, Math.PI, 0); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - dr * 0.4, base - body - h * 0.1 - dr);
    ctx.lineTo(cx, base - body - h * 0.1 - dr - h * 0.16);
    ctx.lineTo(cx + dr * 0.4, base - body - h * 0.1 - dr);
    ctx.closePath(); ctx.fill();
    // agulhas neogóticas ao longo da fachada
    for (let i = 0; i < 14; i++) {
      const t = i / 13;
      if (Math.abs(t - 0.5) < 0.1) continue;
      const px = x + w * (0.03 + t * 0.94), pw = w * 0.014;
      const ph = h * (0.16 + (i % 2) * 0.07);
      ctx.fillRect(px - pw / 2, base - body - ph * 0.4, pw, ph * 0.4);
      ctx.beginPath();
      ctx.moveTo(px - pw, base - body - ph * 0.4);

  // Bastião dos Pescadores: torres cônicas e arcadas sobre a colina
  L.fishermans = function (ctx, x, base, w, h, p, r) {
    const wall = h * 0.28;

    });

    [0.12, 0.34, 0.66, 0.88].forEach((o, i) => {
      const tx = x + w * o, tw = w * (i === 1 || i === 2 ? 0.1 : 0.075);
      const th = h * (i === 1 || i === 2 ? 0.44 : 0.34);
      ctx.fillRect(tx - tw / 2, base - wall - th, tw, th);

      ctx.moveTo(tx - tw * 0.66, base - wall - th);

      ctx.lineTo(tx + tw * 0.66, base - wall - th);

  L.bratislavacastle = function (ctx, x, base, w, h, p, r) {

    ctx.beginPath();

    ctx.fillRect(bx, bb - bh, bw, bh);
    windows(ctx, bx, bb, bw, bh, 8, false);

  // ---- Cracóvia ------------------------------------------------------------

  // Rynek: Sukiennice alongada e as torres desiguais de Santa Maria
  L.clothhall = function (ctx, x, base, w, h, p, r) {
    const body = h * 0.26, bx = x + w * 0.04, bw = w * 0.6;

        ctx.arc(ax, base - body * 0.52, aw, Math.PI, 0);

    ctx.fillRect(bx, base - body - h * 0.07, bw, h * 0.07);
    ctx.beginPath();
    ctx.moveTo(bx - w * 0.015, base - body - h * 0.07);
    ctx.lineTo(bx + bw * 0.5, base - body - h * 0.15);
    ctx.lineTo(bx + bw + w * 0.015, base - body - h * 0.07);
    ctx.closePath(); ctx.fill();

    const t1 = x + w * 0.74, t2 = x + w * 0.88;
    ctx.fillRect(t1 - w * 0.035, base - h * 0.72, w * 0.07, h * 0.72);

    ctx.fillRect(t2 - w * 0.032, base - h * 0.54, w * 0.064, h * 0.54);
    ctx.beginPath();
    ctx.moveTo(t2 - w * 0.045, base - h * 0.54);
    ctx.lineTo(t2, base - h * 0.66); ctx.lineTo(t2 + w * 0.045, base - h * 0.54);

  };

  // Wieliczka: câmara de sal com escoras de madeira e candelabro
  L.saltchapel = function (ctx, x, base, w, h, p, r) {
    // abóbada escavada
    for (let i = 3; i >= 1; i--) {
      const t = i / 3, bw = w * t * 0.96, bh = h * (0.5 + t * 0.48), cx = x + w / 2;
      ctx.globalAlpha = 0.46;
      ctx.beginPath();
      ctx.moveTo(cx - bw / 2, base);
      ctx.lineTo(cx - bw / 2 + bw * 0.05, base - bh * 0.5);
      ctx.quadraticCurveTo(cx, base - bh * 1.06, cx + bw / 2 - bw * 0.05, base - bh * 0.5);
      ctx.lineTo(cx + bw / 2, base);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // escoras de madeira cruzadas
    ctx.lineWidth = Math.max(1.5, w * 0.008); ctx.strokeStyle = ctx.fillStyle;
    [0.16, 0.84].forEach((o) => {
      const px = x + w * o;
      ctx.beginPath();
      ctx.moveTo(px, base); ctx.lineTo(px, base - h * 0.5);
      ctx.moveTo(px, base - h * 0.5); ctx.lineTo(px + (o < 0.5 ? w * 0.1 : -w * 0.1), base - h * 0.62);
      ctx.stroke();
    });
    // candelabro de cristais de sal
    const cx = x + w / 2;
    ctx.fillRect(cx - w * 0.004, base - h * 0.92, w * 0.008, h * 0.2);
    for (let i = 0; i < 3; i++) {
      const ry = base - h * (0.72 - i * 0.05), rw = w * (0.1 - i * 0.026);
      ctx.lineWidth = Math.max(1, w * 0.004);
      ctx.beginPath(); ctx.ellipse(cx, ry, rw, h * 0.014, 0, 0, 6.3); ctx.stroke();
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * 6.283;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rw, ry + Math.sin(a) * h * 0.014, w * 0.007, 0, 6.3);

  // ---- Praga ---------------------------------------------------------------

  // Ponte Carlos: arcos, torre gótica e as estátuas no parapeito
  L.charlesbridge = function (ctx, x, base, w, h, p, r) {
    const deck = base - h * 0.34, n = 8, span = w / n;
    ctx.fillRect(x, deck, w, h * 0.08);
    for (let i = 0; i < n; i++) {
      const cx2 = x + span * (i + 0.5);

        ctx.beginPath();
        ctx.arc(cx2 + span * 0.5, deck + h * 0.08, span * 0.38, Math.PI, 0);
        ctx.rect(cx2 + span * 0.5 - span * 0.38, deck + h * 0.08, span * 0.76, base - deck);
        ctx.fill();
      });
    }
    // estátuas sobre os pilares
    for (let i = 1; i < n; i++) {
      const sx = x + span * i;
      ctx.fillRect(sx - w * 0.005, deck - h * 0.075, w * 0.01, h * 0.075);
      ctx.beginPath(); ctx.arc(sx, deck - h * 0.082, w * 0.008, 0, 6.3); ctx.fill();
    }

    const tx = x + w * 0.12, tw = w * 0.1;
    ctx.fillRect(tx - tw / 2, deck - h * 0.62, tw, h * 0.62);
    windows(ctx, tx - tw / 2, deck - h * 0.2, tw, h * 0.42, 1, true);
    ctx.beginPath();
    ctx.moveTo(tx - tw * 0.7, deck - h * 0.62);
    ctx.lineTo(tx, deck - h * 0.86); ctx.lineTo(tx + tw * 0.7, deck - h * 0.62);
    ctx.closePath(); ctx.fill();
    [-1, 1].forEach((s) => {
      ctx.fillRect(tx + s * tw * 0.56 - w * 0.012, deck - h * 0.7, w * 0.024, h * 0.1);

  // Castelo de Praga: São Vito com duas agulhas sobre os telhados de Malá Strana
  L.praguecastle = function (ctx, x, base, w, h, p, r) {
    // telhados baixos em primeiro plano
    for (let i = 0; i < 12; i++) {
      const bw = w / 12, bx = x + i * bw, bh = h * (0.14 + (i % 4) * 0.045);
      ctx.fillRect(bx, base - bh, bw * 0.92, bh);
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.05, base - bh);
      ctx.lineTo(bx + bw * 0.46, base - bh - bw * 0.3);
      ctx.lineTo(bx + bw * 0.97, base - bh);
      ctx.closePath(); ctx.fill();
    }
    // muralha do castelo
    const cb = base - h * 0.3;
    ctx.fillRect(x + w * 0.18, cb - h * 0.2, w * 0.68, h * 0.2);
    windows(ctx, x + w * 0.18, cb, w * 0.68, h * 0.2, 16, false);
    // São Vito: nave alta e duas agulhas gêmeas
    const vx = x + w * 0.46;
    ctx.fillRect(vx - w * 0.11, cb - h * 0.46, w * 0.22, h * 0.46);
    ctx.beginPath();
    ctx.moveTo(vx - w * 0.11, cb - h * 0.46);
    ctx.lineTo(vx, cb - h * 0.56); ctx.lineTo(vx + w * 0.11, cb - h * 0.46);

  // Relógio Astronômico: torre da prefeitura, mostradores e as torres do Týn
  L.astroclock = function (ctx, x, base, w, h, p, r) {
    // casas da praça
    for (let i = 0; i < 6; i++) {
      const bw = w / 6, bx = x + i * bw, bh = h * (0.3 + (i % 3) * 0.06);

      ctx.lineWidth = Math.max(1, w * 0.003); ctx.strokeStyle = ctx.fillStyle;
      ctx.beginPath(); ctx.arc(tx, cy, rad, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(tx, cy, rad * 0.4, 0, 6.3); ctx.fill();

        const a = (i / 12) * 6.283;

        ctx.moveTo(tx + Math.cos(a) * rad * 0.72, cy + Math.sin(a) * rad * 0.72);
        ctx.lineTo(tx + Math.cos(a) * rad, cy + Math.sin(a) * rad); ctx.stroke();
      }
    });

    [0.68, 0.83].forEach((o) => {
      const bx = x + w * o;
      ctx.fillRect(bx - w * 0.035, base - h * 0.74, w * 0.07, h * 0.74);
      spire(ctx, bx, base - h * 0.74, w * 0.075, h * 0.3, true);

  // Casas de canal: fachadas estreitas, empenas variadas, ponte e bicicletas
  L.canalhouses = function (ctx, x, base, w, h, p, r) {
    const n = 11;
    for (let i = 0; i < n; i++) {
      const bw = w / n, bx = x + i * bw, bh = h * (0.5 + ((i * 7) % 5) * 0.07);
      ctx.fillRect(bx + bw * 0.07, base - bh, bw * 0.86, bh);
      const g = i % 3;
      let sy = base - bh;
      if (g === 0) { // empena em degraus
        for (let s = 0; s < 4; s++) {
          const ins = bw * (0.1 + s * 0.09);
          ctx.fillRect(bx + ins, sy - bw * 0.11, bw - ins * 2, bw * 0.12);
          sy -= bw * 0.11;
        }
      } else if (g === 1) { // empena de campânula
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.07, sy);
        ctx.quadraticCurveTo(bx + bw * 0.5, sy - bw * 0.62, bx + bw * 0.93, sy);
        ctx.closePath(); ctx.fill();
      } else { // bico triangular com gancho de içamento
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.04, sy);
        ctx.lineTo(bx + bw * 0.5, sy - bw * 0.44);
        ctx.lineTo(bx + bw * 0.96, sy); ctx.closePath(); ctx.fill();
        ctx.fillRect(bx + bw * 0.47, sy - bw * 0.5, bw * 0.06, bw * 0.1);
      }
      cut(ctx, () => {
        for (let f = 0; f < 4; f++) {
          for (let c = 0; c < 2; c++) {
            ctx.fillRect(bx + bw * (0.22 + c * 0.34), base - bh + h * 0.03 + f * bh * 0.21,
              bw * 0.22, bh * 0.13);
          }
        }
      });
    }
    // ponte em arco sobre o canal
    const bx2 = x + w * 0.62, bwd = w * 0.3;
    ctx.fillRect(bx2, base - h * 0.05, bwd, h * 0.035);
    cut(ctx, () => {
      ctx.beginPath();
      ctx.arc(bx2 + bwd * 0.5, base - h * 0.015, bwd * 0.3, Math.PI, 0); ctx.fill();
    });
    // bicicletas encostadas no parapeito
    for (let i = 0; i < 4; i++) {
      const wx = x + w * (0.08 + i * 0.1);
      ctx.lineWidth = Math.max(1, w * 0.0035); ctx.strokeStyle = ctx.fillStyle;
      ctx.beginPath(); ctx.arc(wx, base - h * 0.022, w * 0.013, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(wx + w * 0.032, base - h * 0.022, w * 0.013, 0, 6.3); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(wx, base - h * 0.022); ctx.lineTo(wx + w * 0.016, base - h * 0.055);
      ctx.lineTo(wx + w * 0.032, base - h * 0.022); ctx.stroke();
    }
  };

  // Luxemburgo: a cidade alta sobre o vale, casamatas na rocha e o Grund
  L.corniche = function (ctx, x, base, w, h, p, r) {
    // penhasco
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.lineTo(x, base - h * 0.24);

    ctx.bezierCurveTo(x + w * 0.72, base - h * 0.78, x + w * 0.86, base - h * 0.4, x + w, base - h * 0.3);
    ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
    // muralha no alto
    ctx.fillRect(x + w * 0.28, base - h * 0.86, w * 0.48, h * 0.11);
    cut(ctx, () => {
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(x + w * (0.3 + i * 0.066), base - h * 0.88, w * 0.026, h * 0.035);
      }
    });
    // torres e casas da cidade alta
    [0.34, 0.5, 0.66].forEach((o, i) => {
      const tx = x + w * o, tw = w * 0.05;
      ctx.fillRect(tx - tw / 2, base - h * (0.98 + i * 0.02), tw, h * 0.14);
      ctx.beginPath();
      ctx.moveTo(tx - tw * 0.7, base - h * (0.98 + i * 0.02));
      ctx.lineTo(tx, base - h * (1.1 + i * 0.02));
      ctx.lineTo(tx + tw * 0.7, base - h * (0.98 + i * 0.02));
      ctx.closePath(); ctx.fill();
    });
    // casamatas: vãos escavados na rocha
    cut(ctx, () => {
      for (let i = 0; i < 5; i++) {
        const ax = x + w * (0.3 + i * 0.1), ay = base - h * (0.42 + (i % 2) * 0.1);
        const aw = w * 0.022;
        ctx.beginPath();
        ctx.arc(ax, ay, aw, Math.PI, 0);
        ctx.rect(ax - aw, ay, aw * 2, h * 0.045); ctx.fill();
      }
    });
    // casario do Grund, embaixo
    for (let i = 0; i < 8; i++) {
      const bx = x + w * (0.04 + i * 0.055), bh = h * (0.08 + (i % 3) * 0.025);
      ctx.fillRect(bx, base - bh, w * 0.042, bh);
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.006, base - bh);
      ctx.lineTo(bx + w * 0.021, base - bh - h * 0.03);
      ctx.lineTo(bx + w * 0.048, base - bh); ctx.closePath(); ctx.fill();
    }
  };

  window.Landmarks = L;

    "clock-square":   ["spires",   { count: 2, clock: 1 }]
  };

  // arquétipo de fundo por trás de cada monumento
  const LMBG = {
    eiffel: "houses", notredame: "houses", louvre: "palace",
    grandplace: "houses", koelnerdom: "houses", strasbourgcath: "houses",
    kapellbruecke: "mountain", titlis: "mountain",
    duomomilano: "houses", galleria: "vault", venice: "water",
    stephansdom: "houses", schoenbrunn: "palace",
    parliament: "houses", fishermans: "hill",
    bratislavacastle: "hill", clothhall: "houses", saltchapel: "vault",
    charlesbridge: "houses", praguecastle: "hill", astroclock: "houses",
    canalhouses: "houses", corniche: "hill"
  };

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mix(a, b, t) {
    const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    const r = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return "rgb(" + r[0] + "," + r[1] + "," + r[2] + ")";
  }

  // ---- silhuetas ------------------------------------------------------------

  function silTower(ctx, x, base, w, h, p, r) {
    const cx = x + w / 2, topW = w * (p.gate ? 0.5 : 0.16);
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, base);
    ctx.lineTo(cx - topW / 2, base - h);
    ctx.lineTo(cx + topW / 2, base - h);
    ctx.lineTo(cx + w / 2, base);
    ctx.closePath(); ctx.fill();
    if (p.gate) {
      ctx.beginPath();
      ctx.moveTo(cx - topW / 2, base - h);
      ctx.lineTo(cx, base - h - h * 0.28);
      ctx.lineTo(cx + topW / 2, base - h);
      ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx, base - w * 0.34, w * 0.2, Math.PI, 0); ctx.rect(cx - w * 0.2, base - w * 0.34, w * 0.4, w * 0.34);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    if (p.lattice) {
      ctx.globalCompositeOperation = "destination-out";
      for (let i = 1; i <= 2; i++) {
        const t = i / 3.2, y = base - h * t, ww = w * (1 - t * 0.78);
        ctx.fillRect(cx - ww / 2 + ww * 0.12, y, ww * 0.76, h * 0.018);
      }
      ctx.beginPath();
      ctx.arc(cx, base, w * 0.44, Math.PI, 0); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function silSpires(ctx, x, base, w, h, p, r) {
    const n = p.count || 2, body = h * (p.wide ? 0.42 : 0.5);
    ctx.fillRect(x, base - body, w, body);
    for (let i = 0; i < n; i++) {
      const cx = x + w * ((i + 0.5) / n);
      const sh = h * (p.spiky ? (0.55 + r() * 0.45) : (i % 2 ? 0.82 : 1));
      const sw = w / n * (p.spiky ? 0.16 : 0.34);
      ctx.beginPath();
      ctx.moveTo(cx - sw, base - body);
      ctx.lineTo(cx, base - body - sh);
      ctx.lineTo(cx + sw, base - body - sh * (p.spiky ? 1 : 0.98));
      ctx.closePath(); ctx.fill();
    }
    if (p.clock) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath(); ctx.arc(x + w * 0.5, base - body * 0.58, w * 0.07, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalCompositeOperation = "destination-out";
    const cols = Math.max(4, Math.round(w / 34));
    for (let i = 0; i < cols; i++) {
      const wx = x + w * ((i + 0.5) / cols);
      ctx.beginPath();
      ctx.arc(wx, base - body * 0.34, w / cols * 0.14, Math.PI, 0);
      ctx.rect(wx - w / cols * 0.14, base - body * 0.34, w / cols * 0.28, body * 0.3);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function silPalace(ctx, x, base, w, h, p, r) {
    const body = h * 0.62;
    ctx.fillRect(x, base - body, w, body);
    if (p.dome) {
      const cx = x + w / 2, dr = w * 0.11;
      ctx.beginPath(); ctx.arc(cx, base - body, dr, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - dr * 0.16, base - body - dr - h * 0.12, dr * 0.32, h * 0.12);
    } else {
      ctx.beginPath();
      ctx.moveTo(x + w * 0.38, base - body);
      ctx.lineTo(x + w * 0.5, base - body - h * 0.13);
      ctx.lineTo(x + w * 0.62, base - body);
      ctx.closePath(); ctx.fill();
    }
    const tw = p.towers || 0;
    for (let i = 0; i < tw; i++) {
      const cx = x + w * ((i + 0.5) / tw), tw2 = w * 0.05;
      ctx.fillRect(cx - tw2 / 2, base - body - h * 0.2, tw2, h * 0.2);
      if (p.blocky) { ctx.beginPath(); ctx.moveTo(cx - tw2, base - body - h * 0.2); ctx.lineTo(cx, base - body - h * 0.32); ctx.lineTo(cx + tw2, base - body - h * 0.2); ctx.closePath(); ctx.fill(); }
    }
    ctx.globalCompositeOperation = "destination-out";
    const cols = Math.max(8, Math.round(w / 26));
    for (let i = 0; i < cols; i++) {
      const wx = x + w * ((i + 0.5) / cols), ww = w / cols * 0.3;
      ctx.beginPath();
      ctx.arc(wx, base - body * 0.52, ww, Math.PI, 0);
      ctx.rect(wx - ww, base - body * 0.52, ww * 2, body * 0.3);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    if (p.garden) {
      for (let i = 0; i < 9; i++) {
        const gx = x + w * (i + 0.5) / 9;
        ctx.beginPath(); ctx.ellipse(gx, base + h * 0.03, w * 0.02, h * 0.035, 0, 0, 7); ctx.fill();
      }
    }
  }

  function silHouses(ctx, x, base, w, h, p, r) {
    const n = Math.max(6, Math.round(w / (p.narrow ? 46 : 72)));
    for (let i = 0; i < n; i++) {
      const bw = w / n, bx = x + i * bw;
      const bh = h * (p.low ? 0.34 + r() * 0.26 : 0.5 + r() * 0.42);
      ctx.fillRect(bx + bw * 0.06, base - bh, bw * 0.88, bh);
      const g = p.gable || "tri";
      if (g === "tri") {
        ctx.beginPath();
        ctx.moveTo(bx, base - bh); ctx.lineTo(bx + bw / 2, base - bh - bw * 0.4); ctx.lineTo(bx + bw, base - bh);
        ctx.closePath(); ctx.fill();
      } else if (g === "step") {
        let sy = base - bh;
        for (let s = 0; s < 3; s++) {
          const inset = bw * (0.1 + s * 0.13);
          ctx.fillRect(bx + inset, sy - bw * 0.12, bw - inset * 2, bw * 0.13);
          sy -= bw * 0.12;
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.06, base - bh);
        ctx.quadraticCurveTo(bx + bw / 2, base - bh - bw * 0.55, bx + bw * 0.94, base - bh);
        ctx.closePath(); ctx.fill();
      }
    }
    if (p.spires) {
      for (let i = 0; i < p.spires; i++) {
        const cx = x + w * (0.34 + i * 0.16), sw = w * 0.022;
        ctx.fillRect(cx - sw, base - h * 1.05, sw * 2, h * 1.05);
        ctx.beginPath(); ctx.moveTo(cx - sw * 1.6, base - h * 1.05); ctx.lineTo(cx, base - h * 1.34); ctx.lineTo(cx + sw * 1.6, base - h * 1.05); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "destination-out";
    for (let i = 0; i < n * 3; i++) {
      const wx = x + w * (i + 0.5) / (n * 3);
      ctx.fillRect(wx - w / (n * 9), base - h * (0.18 + r() * 0.24), w / (n * 4.5), h * 0.055);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function silBridge(ctx, x, base, w, h, p, r) {
    const n = p.arches || 4, deck = base - h * 0.42, span = w / n;
    ctx.fillRect(x, deck, w, h * 0.1);
    if (p.roof) {
      ctx.beginPath();
      ctx.moveTo(x, deck); ctx.lineTo(x + w * 0.5, deck - h * 0.16); ctx.lineTo(x + w, deck);
      ctx.closePath(); ctx.fill();
    }
    for (let i = 0; i < n; i++) {
      const cx = x + span * (i + 0.5);
      ctx.fillRect(cx - span * 0.1, deck, span * 0.2, base - deck);
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx + span * 0.5, deck + h * 0.1, span * 0.38, Math.PI, 0);
      ctx.rect(cx + span * 0.5 - span * 0.38, deck + h * 0.1, span * 0.76, base - deck);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    if (p.pylon) {
      const cx = x + w * 0.62;
      ctx.fillRect(cx - w * 0.012, base - h * 1.15, w * 0.024, h * 1.15);
      ctx.beginPath(); ctx.arc(cx, base - h * 1.18, w * 0.05, 0, 7); ctx.fill();
      ctx.lineWidth = Math.max(1, w * 0.003); ctx.strokeStyle = ctx.fillStyle;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath(); ctx.moveTo(cx, base - h * 1.1);
        ctx.lineTo(x + w * (0.1 + i * 0.09), deck); ctx.stroke();
      }
    }
    if (p.truss) {
      ctx.lineWidth = Math.max(1, w * 0.004); ctx.strokeStyle = ctx.fillStyle;
      for (let i = 0; i < n; i++) {
        const cx = x + span * i;
        ctx.beginPath();
        ctx.moveTo(cx, deck); ctx.lineTo(cx + span * 0.5, deck - h * 0.2); ctx.lineTo(cx + span, deck);
        ctx.stroke();
      }
    }
    if (p.tower) {
      [x + w * 0.04, x + w * 0.92].forEach((tx) => {
        ctx.fillRect(tx, base - h * 0.95, w * 0.045, h * 0.95 - (base - deck) * 0 );
        ctx.beginPath();
        ctx.moveTo(tx - w * 0.012, base - h * 0.95);
        ctx.lineTo(tx + w * 0.0225, base - h * 1.2);
        ctx.lineTo(tx + w * 0.057, base - h * 0.95);
        ctx.closePath(); ctx.fill();
      });
    }
    if (p.statues) {
      for (let i = 1; i < n; i++) {
        const sx = x + span * i;
        ctx.fillRect(sx - w * 0.006, deck - h * 0.1, w * 0.012, h * 0.1);
      }
    }
  }

  function silHill(ctx, x, base, w, h, p, r) {
    ctx.beginPath();
    ctx.moveTo(x, base);
    const peak = p.cliff ? 0.3 : 0.45;
    ctx.lineTo(x, base - h * 0.12);
    ctx.bezierCurveTo(x + w * 0.2, base - h * 0.2, x + w * (peak - 0.1), base - h * 0.9, x + w * peak, base - h * 0.92);
    ctx.bezierCurveTo(x + w * (peak + 0.18), base - h * 0.94, x + w * 0.8, base - h * 0.3, x + w, base - h * (p.cliff ? 0.5 : 0.14));
    ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
    if (p.castle) {
      const cx = x + w * peak, cw = w * 0.17, cb = base - h * 0.9;
      ctx.fillRect(cx - cw / 2, cb - h * 0.16, cw, h * 0.16);
      for (let i = 0; i < 3; i++) {
        const tx = cx - cw / 2 + cw * (i / 2) - cw * 0.05;
        ctx.fillRect(tx, cb - h * 0.26, cw * 0.11, h * 0.1);
        ctx.beginPath();
        ctx.moveTo(tx - cw * 0.03, cb - h * 0.26); ctx.lineTo(tx + cw * 0.055, cb - h * 0.34); ctx.lineTo(tx + cw * 0.14, cb - h * 0.26);
        ctx.closePath(); ctx.fill();
      }
    }
    if (p.town) {
      for (let i = 0; i < 14; i++) {
        const tx = x + w * (0.06 + r() * 0.88);
        const ty = base - h * (0.06 + r() * 0.2);
        ctx.fillRect(tx, ty, w * 0.028, h * 0.06);
      }
    }
  }

  function silMountain(ctx, x, base, w, h, p, r, snowColor) {
    const n = p.peaks || 4;
    const pts = [[x, base]];
    for (let i = 0; i <= n; i++) {
      const px = x + w * (i / n);
      const py = base - h * (0.35 + r() * 0.62);
      pts.push([px, py]);
    }
    pts.push([x + w, base]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
    if (p.snow && snowColor) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = snowColor;
      for (let i = 1; i < pts.length - 1; i++) {
        const [px, py] = pts[i];
        ctx.beginPath();
        ctx.moveTo(px - w * 0.07, py + h * 0.16);
        ctx.lineTo(px, py - h * 0.01);
        ctx.lineTo(px + w * 0.07, py + h * 0.16);
        ctx.lineTo(px + w * 0.03, py + h * 0.1);
        ctx.lineTo(px - w * 0.02, py + h * 0.15);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  function silVault(ctx, x, base, w, h, p, r) {
    const n = p.bays || 4;
    for (let i = n; i >= 1; i--) {
      const t = i / n;
      const bw = w * t * 0.92, bh = h * (0.55 + t * 0.45);
      const cx = x + w / 2;
      ctx.globalAlpha = p.cave ? 0.5 : 0.42;
      ctx.beginPath();
      if (p.rough) {
        ctx.moveTo(cx - bw / 2, base);
        ctx.lineTo(cx - bw / 2 + bw * 0.06 * r(), base - bh * 0.55);
        ctx.quadraticCurveTo(cx, base - bh * (1 + r() * 0.1), cx + bw / 2 - bw * 0.06 * r(), base - bh * 0.55);
        ctx.lineTo(cx + bw / 2, base);
      } else {
        ctx.moveTo(cx - bw / 2, base);
        ctx.lineTo(cx - bw / 2, base - bh * 0.5);
        ctx.arc(cx, base - bh * 0.5, bw / 2, Math.PI, 0);
        ctx.lineTo(cx + bw / 2, base);
      }
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (p.glass) {
      ctx.globalAlpha = 0.25;
      for (let i = 0; i < 9; i++) {
        const gx = x + w * 0.5 + (i - 4) * w * 0.05;
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, base - h); ctx.lineTo(gx, base); ctx.lineTo(gx + w * 0.01, base); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function silWater(ctx, x, base, w, h, p, r) {
    ctx.fillRect(x, base - h * 0.18, w, h * 0.18);
    if (p.dome) {
      const cx = x + w * 0.72, dr = w * 0.07;
      ctx.beginPath(); ctx.arc(cx, base - h * 0.18, dr, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - dr * 0.12, base - h * 0.18 - dr - h * 0.09, dr * 0.24, h * 0.09);
    }
    for (let i = 0; i < 10; i++) {
      const bx = x + w * (i / 10) + w * 0.01;
      ctx.fillRect(bx, base - h * (0.18 + r() * 0.22), w * 0.035, h * 0.22);
    }
    const boats = p.boats || 0;
    for (let i = 0; i < boats; i++) {
      const bx = x + w * (0.2 + i * 0.28), by = base + h * 0.1;
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.05, by); ctx.quadraticCurveTo(bx, by + h * 0.05, bx + w * 0.05, by);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx - w * 0.002, by - h * 0.09, w * 0.004, h * 0.09);
    }
  }

  const DRAW = {
    tower: silTower, spires: silSpires, palace: silPalace, houses: silHouses,
    bridge: silBridge, hill: silHill, mountain: silMountain, vault: silVault, water: silWater
  };

  // ---- composição -----------------------------------------------------------

  function draw(canvas, scene, accentHex) {
    const box = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.max(2, Math.round(box.width)), H = Math.max(2, Math.round(box.height));
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const art = scene.art || {};
    const pal = SKY[art.sky] || SKY.dusk;
    // monumento desenhado tem prioridade no primeiro plano;
    // o fundo recebe um arquétipo genérico que combine com ele
    const mark = (window.Landmarks && window.Landmarks[art.kind]) || null;
    const [arch, params] = mark
      ? [LMBG[art.kind] || "houses", {}]
      : (KIND[art.kind] || ["houses", {}]);
    const r = rng(hash(scene.name + art.kind));
    const interior = art.sky === "interior" || art.sky === "underground";
    const horizon = interior ? H * 0.9 : H * (art.water ? 0.66 : 0.78);

    // céu
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, mix(pal[0], pal[1], 0.3)); g.addColorStop(0.34, pal[1]);
    g.addColorStop(0.66, pal[2]); g.addColorStop(1, pal[3]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);

    // disco de luz
    const sunX = W * (0.2 + r() * 0.6), sunY = horizon - H * (0.08 + r() * 0.18);
    const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.55);
    sg.addColorStop(0, art.sky === "night" ? "rgba(210,225,255,.5)" : "rgba(255,240,215,.62)");
    sg.addColorStop(0.35, "rgba(255,230,190,.14)");
    sg.addColorStop(1, "rgba(255,230,190,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, horizon + 2);
    if (!interior) {
      ctx.beginPath(); ctx.arc(sunX, sunY, H * (art.sky === "night" ? 0.022 : 0.034), 0, 7);
      ctx.fillStyle = art.sky === "night" ? "rgba(226,236,255,.92)" : "rgba(255,247,228,.9)";
      ctx.fill();
    }

    // chão / água
    ctx.fillStyle = art.water ? mix(pal[3], pal[0], 0.62) : mix(pal[3], "#0b0e13", 0.72);
    ctx.fillRect(0, horizon, W, H - horizon);

    // camadas de silhueta, do fundo para a frente
    const layers = interior ? 1 : 3;
    for (let L = 0; L < layers; L++) {
      const t = layers === 1 ? 1 : L / (layers - 1);
      const depth = 0.3 + t * 0.7;
      const base = horizon + (H - horizon) * (interior ? 0 : t * 0.14);
      const h = H * (interior ? 0.8 : (0.2 + depth * 0.26));
      const inset = (1 - depth) * W * 0.12;
      const isFront = L === layers - 1;
      // o monumento ocupa o centro e recebe mais altura: é o assunto da cena
      const mw = W * (interior ? 1 : 0.66), mx = (W - mw) / 2;
      const mh = H * (interior ? 0.84 : 0.5);

      // o primeiro plano vira silhueta escura: é o contraste que faz o monumento ler
      ctx.fillStyle = isFront
        ? mix(mix(accentHex, pal[0], 0.4), "#05070D", 0.5)
        : mix(pal[2], pal[0], 0.2 + t * 0.34);
      ctx.save();
      if (isFront && mark) {
        mark(ctx, mx, base, mw, mh, params, r);
      } else {
        DRAW[arch](ctx, -inset, base, W + inset * 2, h, isFront ? params : { ...params, low: 1 }, r,
          mix("#ffffff", pal[3], 0.18));
      }
      ctx.restore();

      // reflexo na água
      if (art.water && isFront && !interior) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.translate(0, base * 2); ctx.scale(1, -1);
        ctx.fillStyle = mix(pal[2], accentHex, 0.7);
        if (mark) mark(ctx, mx, base, mw, mh * 0.92, params, rng(hash(scene.name)));
        else DRAW[arch](ctx, -inset, base, W + inset * 2, h * 0.92, params, rng(hash(scene.name)), null);
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.fillStyle = mix(pal[3], pal[0], 0.55);
        for (let i = 0; i < 26; i++) {
          const wy = base + (H - base) * Math.pow(i / 26, 1.5);
          ctx.globalAlpha = 0.16 + (i / 26) * 0.2;
          ctx.fillRect(W * r() * 0.9, wy, W * (0.05 + r() * 0.22), Math.max(1, H * 0.004));
        }
        ctx.globalAlpha = 1;
      }
    }

    // névoa
    const hg = ctx.createLinearGradient(0, horizon - H * 0.22, 0, horizon + H * 0.06);
    hg.addColorStop(0, "rgba(255,255,255,0)");
    hg.addColorStop(1, art.sky === "night" ? "rgba(40,60,95,.34)" : "rgba(255,244,226,.3)");
    ctx.fillStyle = hg; ctx.fillRect(0, horizon - H * 0.22, W, H * 0.28);

    // vinheta + granulado
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.2, W / 2, H * 0.5, H * 0.95);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,6,11,.34)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.05;
    for (let i = 0; i < (W * H) / 700; i++) {
      ctx.fillStyle = r() > 0.5 ? "#fff" : "#000";
      ctx.fillRect(r() * W, r() * H, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  window.SceneArt = { draw: draw };
})();
